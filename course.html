   body:`
# Price impact in practice

Kyle gave us a clean, derivable answer: impact is **linear** in order flow, at rate λ. It is the most-cited result in the field, and it is empirically **wrong** — in an interesting way.

This lesson is the collision between the two cleanest things in microstructure: the best model and the most robust measurement. Neither survives intact.

## First, split the impact in two

Before measuring anything, separate two effects that a price chart hopelessly conflates. You buy a large parent order over an hour. The price rises. You stop. Some of the rise stays; some of it drains away.

\`\`\`
   price
     │                    ╭─────╮
     │                ╭───╯      ╰────╮
     │            ╭───╯                ╰──────────────  ← permanent
     │        ╭───╯                                        component
     │  ──────╯
     │
     └──────┬──────────────────┬─────────────────────▶ time
         you start          you stop

     the hump you push up while trading  =  TEMPORARY impact
     the level it settles at afterwards  =  PERMANENT impact
\`\`\`

The two have completely different causes, and you already have both models:

\`\`\`
   PERMANENT  ← Glosten–Milgrom (M1.2).  The market inferred information
                from your flow and genuinely revised its belief. It does
                not revert, because nobody thinks they were wrong.

   TEMPORARY  ← Ho–Stoll (M1.3).  You consumed resting liquidity and left
                makers holding inventory they didn’t want, so they skewed
                their quotes. As they work back to flat, it decays.
\`\`\`

This is why M1.3 insisted on the distinction. **Permanent impact is the price of being informative; temporary impact is the price of being in a hurry.** You can reduce the second by trading patiently. You cannot reduce the first at all — if your trading genuinely predicts the future, the market is right to move against you, and that cost is inseparable from having alpha in the first place.

## The square-root law

Now measure it. Across equities, futures, FX, options, across decades, across venues, one relationship keeps showing up:

\`\`\`
              ΔP  ≈  Y · σ · √( Q / V )

     ΔP  price move caused by the order (in the same units as σ)
     σ   the asset’s daily volatility
     Q   the size of your parent order
     V   the asset’s average daily volume
     Y   a constant of order ½ to 1, mildly venue- and asset-dependent
\`\`\`

Note what it does *not* contain: any parameter fitted per stock beyond the two you already know (σ and V), and any hint of Kyle’s linearity. The dependence on size is **concave** — the marginal cost of the next share falls as your order grows.

Some numbers, for a stock with 2% daily volatility, taking Y = 1:

\`\`\`
   you trade… (% of ADV)     √(Q/V)      price move    cost as % of ADV traded
   ──────────────────────────────────────────────────────────────────────────
        0.1%                  0.032         0.06%             tiny
        1%                    0.100         0.20%             noticeable
        10%                   0.316         0.63%             expensive
        50%                   0.707         1.41%             you are the market
       100%                   1.000         2.00%             a full day’s σ
\`\`\`

The concavity is the whole story. Going from 1% to 10% of volume — **ten times the size** — only triples the price move. That is very good news if you are large, and it is the reason large funds exist at all.

## But the cost scales as Q^1.5

Here is the trap, and it catches people who have just learned the square-root law and drawn the wrong conclusion from its concavity.

You pay the impact **on every share you trade**, so:

\`\`\`
   cost  ≈  ΔP × Q  ∝  √Q × Q  =  Q^1.5
\`\`\`

Ten times the size is only three times the *price move*, but **thirty times the total cost**. Impact per share is concave; the bill is convex. Two things follow immediately:

**Every strategy has a capacity.** Your expected alpha scales like Q — twice the position, twice the profit. Your cost scales like Q^1.5. There is therefore a size at which the two cross and the strategy stops making money, no matter how good the signal. This is not a failure of execution; it is arithmetic, and it is why a strategy that prints money on £10m can be worthless at £1bn.

**Slicing is worth real money.** If impact depends on your participation rate rather than your absolute size, then splitting a parent order into child orders spread over time — and letting fresh liquidity and fresh noise traders arrive between them — genuinely reduces the bill. That is what the entire execution-algorithm industry sells: VWAP, TWAP, implementation-shortfall and participation-rate algos are all variations on *how slowly dare I go*.

And there’s the trade-off that makes execution a real problem rather than a solved one: **trade fast and pay impact; trade slow and bear risk** that the price moves for unrelated reasons before you’re done. The optimal schedule balances the two — that’s the Almgren–Chriss framework, and it is the direct commercial descendant of everything in M1.

## Why the square root? (honestly: unsettled)

There is no consensus derivation. Three serious families of explanation:

- **Latent liquidity.** The visible book is a tiny fraction of real trading intent; most liquidity is latent, in the minds of traders who reveal it only as the price approaches. Under plausible assumptions about how that latent density is shaped near the current price, √ falls out.
- **Fair pricing / no-arbitrage in impact.** If impact were linear, a trader could in some setups profitably round-trip against their own footprint; requiring that this be impossible pins the exponent near ½.
- **Propagator models.** Model impact as a decaying kernel applied to each child order. Order flow is famously long-memory (it autocorrelates for hours), and the decay must exactly offset that persistence or prices would be predictable — which forces a concave aggregate.

They are not mutually exclusive and none is airtight. Be comfortable saying the law is an extremely robust empirical regularity with contested foundations — that is the honest state of the field, and pretending otherwise is a tell.

## Reconciling with Kyle

Kyle isn’t refuted so much as **local**. Its linear λ describes a single auction with a fixed information set and Gaussian noise; the square-root law describes a parent order worked over hours against a market whose liquidity replenishes and whose participants adapt. Kyle is the right object for “what does one unit of surprise flow do right now”; the square-root law is the right object for “what will this £50m cost me by close.”

Both survive because they answer different questions. Reaching for the wrong one is the actual error.

> **Pub test:** Impact splits into **permanent** (the market learned something — Glosten–Milgrom) and **temporary** (you consumed liquidity and makers are skewed — Ho–Stoll), and only the permanent part stays after you stop. Empirically impact is **not** Kyle-linear but follows the **square-root law**, ΔP ≈ Y·σ·√(Q/V) with Y of order ½ to 1 — trade 1% of a day’s volume in a 2%-vol name and you move it about 0.2%. Because cost is impact **times** size, total cost scales like **Q^1.5**, which is why parent orders are sliced, why trading slowly is worth real money, and why every strategy has a **capacity** beyond which its alpha is eaten by its own footprint.
`},

# Latency & the HFT layer

This is the lesson most likely to be distorted by things you’ve already read, so it’s worth being precise. Speed is not a general-purpose advantage. It buys **two specific things**, and outside those two it buys nothing at all.

## What speed actually buys

**1. Queue position.** M0.2’s price-time priority means that at a given price level, orders fill in arrival order. If 40,000 shares rest at 50.00 and you are behind 30,000 of them, you fill only if the level trades more than 30,000 before it is cancelled or the price moves away.

\`\`\`
   the bid at 50.00, in arrival order

   ┌────────┬────────┬─────────┬─────────┬──────────────┐
   │ 12,000 │ 8,000  │ 10,000  │  YOU    │  later ...   │
   └────────┴────────┴─────────┴─────────┴──────────────┘
     ◀── fills first                       fills last ──▶
     30,000 shares ahead of you

   a 25,000-share market sell arrives  →  you get NOTHING
   a 45,000-share market sell arrives  →  you get 15,000
\`\`\`

Being a microsecond earlier moves you up the queue, and queue position is close to binary in its consequences. This is why the top of the book is not a “price” so much as a **race result**.

**2. Picking off stale quotes.** A maker’s quote reflects its estimate of value. When something that determines that value moves — the futures contract, an ETF’s underlying basket, the same stock on another venue — the quote is briefly *wrong*, and stays wrong until the maker can cancel it.

\`\`\`
   t = 0 μs    ES futures tick up. SPY is now worth more.
   t = ?       fast TAKER hits every stale SPY offer still resting
   t = ?       slower MAKER cancels — too late

   whoever’s message arrives first, wins. Same information,
   available to both. The entire contest is transmission time.
\`\`\`

Look carefully at what that is: **adverse selection where the private information is nothing but speed**. The maker loses exactly as it loses to a fundamental informed trader in M1.2 — it sold just before the price rose. Glosten–Milgrom’s μ, at microsecond resolution, is partly just *how many people are faster than me*.

This is why the arms race is symmetric and why it doesn’t end. Makers invest in speed **defensively**, to cancel before being picked off; takers invest **offensively**, to arrive before the cancel. Both are buying the same microseconds from the same suppliers.

## The physical layer

The constraints are embarrassingly concrete for a financial market.

\`\`\`
   Chicago ⇄ New Jersey, ~1,200 km each way

   light in vacuum          299,792 km/s   →  8.0 ms round trip
   light in optical fibre   ~200,000 km/s  →  12.0 ms  (glass is slow,
                                                and routes aren’t straight)
   Spread Networks fibre (2010)            →  ~13 ms — a $300m tunnel
                                                through the Alleghenies
   microwave through air (2012→)           →  ~8.5 ms — air beats glass,
                                                weather permitting
\`\`\`

Microwave beat a $300m fibre build within about two years, largely because the refractive index of air is closer to 1 than glass. Latency is now measured in **nanoseconds** inside a matching engine’s colocation hall, where the binding constraint can be the length of your cross-connect cable — which is why exchanges sell every customer the *same* cable length regardless of rack position.

## Where speed does not matter

This is the part usually omitted, and it matters more to most readers than everything above.

**If your holding period is longer than seconds, latency is not your cost.** A fund buying £50m of a stock to hold for six months is not losing to microseconds. It is paying **spread** (M0.4) and **impact** (M1.5) — costs measured in tens of basis points, orders of magnitude larger than anything latency does to it. Optimising the wrong one is a common and expensive mistake.

**Retail is not the victim of latency.** Retail orders are mostly internalised by wholesalers (M0.3) at or inside the NBBO, and never touch the race. The genuine questions about retail execution are about PFOF, segmentation and price improvement — not speed.

**The measured spread has fallen.** Whatever else HFT did, spreads and explicit costs are dramatically lower than in the quarter-fraction era. The serious critique isn’t “spreads got worse”; it’s about *who* captures the remaining spread, and whether the resources burned racing for it are socially wasted.

## The mechanism-design critique

The sharpest academic argument (Budish, Cramton & Shim, 2015) isn’t that fast traders are villains. It’s that **the continuous limit order book is a badly designed mechanism**: by processing messages in continuous time and serially, it turns every public information event into a race, and races are won by speed rather than by price. The rents are then competed into infrastructure spending rather than into tighter spreads.

Their proposed fix is elegant: **frequent batch auctions**. Discretise time into (say) 100ms intervals and clear all orders in each interval at a single uniform price. Arriving 5 μs earlier within a batch is worth exactly nothing, so the race collapses and competition returns to price. Related, live experiments: **IEX’s 350 μs speed bump** (a physical coil of fibre) and various asymmetric delays that slow takers but not maker cancellations.

None of this is settled policy, and batching has real costs of its own. But it reframes the debate usefully — from “are HFT firms good or bad people” to “what behaviour is this mechanism paying for?”

## And Flash Boys

Read it, but read it **after** the above, which is the roadmap’s advice and worth following. It is a genuinely good piece of narrative journalism, and it is also a book with protagonists — the IEX founders — whose venue it is effectively arguing for. Held up against the material in this module, you can see clearly which parts are accurate (the races are real, the stale-quote picking is real, the infrastructure spending is real) and which are overdrawn (that this constitutes systematic theft from ordinary investors, whose actual costs are spread and impact).

Being able to make that separation is roughly what M1 was for.

> **Pub test:** Speed buys two specific things and nothing else — **queue position** under price-time priority (M0.2), and the race to **pick off stale quotes** when a correlated price moves before the maker can cancel. The second is just adverse selection where the private information is *being fast*, which is why makers spend to defend as hard as takers spend to attack, and why Budish–Cramton–Shim call continuous trading a mechanism that manufactures an **arms race**. Where speed does **not** matter is anything held longer than seconds — a fund holding for a day pays **spread and impact** (M1.5), not latency, so most retail-facing “HFT is robbing you” claims point at the wrong cost.
`},

# Flow toxicity & maker-taker economics

M1 has been building one thing without stating it. Here it is, and every term is a lesson you have already done:

\`\`\`
   MAKER’S EDGE PER UNIT TRADED

     +  spread captured        earn the half-spread            M0.4
     +  rebate                 exchange pays you to post       this lesson
     −  adverse selection      you traded with the informed    M1.2
     −  inventory cost         you’re holding risk (γqσ²τ)     M1.3
     −  fees & tech            colocation, feeds, clearing     M0.6 / M1.6
   ────────────────────────────────────────────────────────────────────
     =  what a market-making business actually optimises
\`\`\`

Read that as a job description and the industry stops being mysterious. Nobody at these firms is trying to be fast, or to be tight, or to have volume. They are trying to make that expression positive, at scale, and every apparent quirk of their behaviour is one of those terms being managed.

## Toxicity: adverse selection you can measure

**Toxic flow** is order flow that systematically loses money for the maker who fills it — the adverse-selection term, made operational. It’s the practitioner’s word for μ in Glosten–Milgrom.

The maker cannot see μ. But it can see something suggestive: **order-flow imbalance**. Informed flow is directional by construction; noise flow is roughly balanced. So sustained one-sidedness is evidence of information.

**VPIN** (volume-synchronised probability of informed trading) formalises that. Rather than clock time, bucket the tape into equal-**volume** buckets — so busy periods generate more observations, which is the point:

\`\`\`
   for each bucket of V shares, classify volume as buy- or sell-initiated:

                  Σ over buckets  | V_buy − V_sell |
        VPIN  =  ───────────────────────────────────
                        n · V

   balanced flow  (V_buy ≈ V_sell)  →  VPIN → 0   → benign
   one-sided flow (all one way)     →  VPIN → 1   → toxic
\`\`\`

Used live, a rising VPIN says *widen, or stop quoting*. Easley, López de Prado and O’Hara showed it climbing sharply before the **May 2010 Flash Crash**, and argued it works as an early-warning signal for liquidity withdrawal.

**It is contested, and you should know that.** Andersen and Bondarenko argued the result is largely an artefact — that VPIN is substantially a repackaging of volatility and volume, that its bulk volume classification is noisy, and that its predictive claims don’t survive careful testing. The honest position: the *concept* of toxicity is indispensable and every real maker estimates something like it; **VPIN specifically** is one contested estimator, not a settled measurement. Say that in an interview and you’ll sound like someone who read past the abstract.

## Maker-taker: exchanges paying for liquidity

Venues compete for order flow, and liquidity is self-reinforcing — a book with depth attracts more depth. So exchanges pay for it.

\`\`\`
   MAKER-TAKER  (the common model)
     post a resting order that gets filled  →  you RECEIVE a rebate
     take liquidity with a marketable order →  you PAY a fee
     typical US equities: −0.20 ¢ / +0.30 ¢ per 100 shares
     the exchange keeps the difference

   TAKER-MAKER / “inverted”  (some venues)
     exactly reversed — pays takers, charges makers.
     Exists to attract takers to a thin book, and because some
     flow is worth paying for (see segmentation, below).
\`\`\`

Two consequences that matter more than the arithmetic:

**The economically real spread is net of rebates.** A quoted spread of one cent, with a rebate of 0.2 cents per side, is not a one-cent spread to the participants. It can be rational to post at a price that looks like it loses money on the spread alone, because the rebate makes it profitable — which is precisely how markets stay quoted at the minimum tick.

**Routing incentives and client interests come apart.** The rebate accrues to whoever posts the order — the **broker** — while best execution is owed to the **client**. A broker choosing between venues offering identical prices but different rebates has an interest that is not the client’s. This is a live regulatory question, it is why Reg NMS’s protection of *displayed prices* doesn’t settle the matter, and it is the sharpest structural criticism of maker-taker.

## Segmentation: the punchline of M0 and M1 together

Now put PFOF (M0.3), adverse selection (M1.2) and toxicity together, because the combination explains the shape of the modern US equity market.

\`\`\`
   ALL ORDER FLOW
        │
        ├──▶ RETAIL ──▶ wholesaler / internaliser
        │              low μ, predictable, benign
        │              → filled off-exchange, INSIDE the quoted spread
        │              → wholesaler pays the broker for it (PFOF)
        │
        └──▶ EVERYTHING ELSE ──▶ the lit book
                       institutions, funds, other makers
                       → higher average μ  →  MORE TOXIC
                       → lit spreads must be WIDER to survive it
\`\`\`

Wholesalers aren’t being generous when they price-improve retail orders. They are paying for the *right kind* of counterparty — and every benign order they remove raises the average toxicity of what’s left on the lit book, which must widen accordingly.

That gives you the genuinely hard policy question, which has no clean answer: retail investors demonstrably get **better** prices than the displayed quote, while the displayed quote itself is **worse** than it would be if their flow were in it. Whether that is good depends on who you weigh, and anyone confident in either direction is skipping a step.

## What this module was for

You can now read a real market as a system of forces rather than a set of terms:

- A **spread** is order-processing plus inventory plus adverse selection (M0.4), and you can derive the last two (M1.2, M1.3).
- A **price move** is permanent or temporary, and which one it is tells you whether it was information or inventory (M1.5).
- **Depth** is not resting size — it is how hard it is to distinguish information from noise (M1.4).
- **Speed** buys queue position and stale quotes, and nothing else (M1.6).
- A **market-making business** is the equation at the top of this page (M1.7).

M2 changes the subject to pricing and strategy, and M5 returns to these same firms to ask how they’re actually organised and paid. But the layer in this module is the one most of them live in.

> **Pub test:** A maker’s edge is one equation — **spread captured + rebate − adverse selection − inventory cost − fees**, and every term is a lesson in this module. **Toxicity** is the adverse-selection term measured on live flow; **VPIN** estimates it from order-flow imbalance in volume buckets, and is genuinely contested. **Maker-taker** pricing pays the maker a rebate and charges the taker, so the economically relevant spread is the quoted spread *net of rebates* — and because the rebate accrues to the **broker** while best execution is owed to the client, routing incentives and client interests come apart. **Segmentation** is the punchline — wholesalers cream off uninformed retail, so what reaches the lit book is more toxic than average, and lit spreads must be wider to survive it.
`},

/* ============================================================
   tiny markdown -> html (controlled subset)
   ============================================================ */
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function inline(s){
  return esc(s)
    .replace(/`([^`]+)`/g,"<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>")
    .replace(/\*([^*]+)\*/g,"<em>$1</em>");
}
function mdToHtml(md){
  const lines = md.replace(/\r/g,"").replace(/^\n+/,"").split("\n");
  let out=[], para=[], list=[], quote=[], pre=null;
  const flushP=()=>{ if(para.length){ out.push("<p>"+inline(para.join(" "))+"</p>"); para=[]; } };
  const flushL=()=>{ if(list.length){ out.push("<ul>"+list.map(li=>"<li>"+inline(li)+"</li>").join("")+"</ul>"); list=[]; } };
  const flushQ=()=>{ if(quote.length){ out.push("<blockquote>"+mdToHtml(quote.join("\n"))+"</blockquote>"); quote=[]; } };
  const flushAll=()=>{flushP();flushL();flushQ();};
  for(let raw of lines){
    if(pre!==null){
      if(raw.trim().startsWith("```")){ out.push('<pre class="diagram">'+esc(pre.join("\n"))+"</pre>"); pre=null; }
      else pre.push(raw);
      continue;
    }
    if(raw.trim().startsWith("```")){ flushAll(); pre=[]; continue; }
    const t=raw.trim();
    if(t===""){ flushAll(); continue; }
    let m;
    if(m=t.match(/^(#{1,4})\s+(.*)$/)){ flushAll(); const n=m[1].length; out.push(`<h${n}>`+inline(m[2])+`</h${n}>`); continue; }
    if(/^---+$/.test(t)){ flushAll(); out.push("<hr>"); continue; }
    if(m=t.match(/^>\s?(.*)$/)){ flushP(); flushL(); quote.push(m[1]); continue; }
    if(m=t.match(/^[-*]\s+(.*)$/)){ flushP(); flushQ(); list.push(m[1]); continue; }
    flushL(); flushQ(); para.push(t);
  }
  if(pre!==null){ out.push('<pre class="diagram">'+esc(pre.join("\n"))+"</pre>"); }
  flushAll();
  return out.join("\n");
}

      });
    } else {
      html+=`<div class="item locked"><span class="mark">·</span><span>not broken down yet</span></div>`;
    }
    html+="</div>";
  });
  sb.innerHTML=html;
}

function show(id){
  const l=byId[id]; if(!l) return;
  const c=document.getElementById("content");
  let html=mdToHtml(l.body);
  if(l.source) html+=`<div class="source"><b>↳ go deeper:</b> ${inline(l.source)}</div>`;
  const idx=ORDER.indexOf(id);
  const prev=idx>0?ORDER[idx-1]:null, next=idx<ORDER.length-1?ORDER[idx+1]:null;
  const prevOk=prev&&byId[prev]&&byId[prev].done, nextOk=next&&byId[next]&&byId[next].done;
  html+=`<div class="nav">
    <a class="${prevOk?'':'disabled'}" ${prevOk?`onclick="show('${prev}')"`:''}>← ${prevOk?byId[prev].title:''}</a>
    ${ nextOk
        ? `<a onclick="show('${next}')">${byId[next].title} →</a>`
        : `<a class="" style="color:var(--dim2);border-style:dashed" >next lesson: say "next" in your session →</a>` }
  </div>`;
  c.innerHTML=html;
  document.getElementById("crumb").innerHTML="markets <span style='color:var(--dim)'>▸</span> "+id;
  document.getElementById("progress").textContent=l.module;
  buildSidebar(id);
  window.scrollTo(0,0);
  document.getElementById("sidebar").classList.remove("open");
  location.hash=id;
}

document.getElementById("menu-btn").onclick=()=>document.getElementById("sidebar").classList.toggle("open");

// boot
const start = (location.hash && byId[location.hash.slice(1)] && byId[location.hash.slice(1)].done)
  ? location.hash.slice(1)
  : LESSONS.filter(l=>l.done).slice(-1)[0]?.id || LESSONS[0].id;
buildSidebar(start);
show(start);
</script>
</body>
</html>
