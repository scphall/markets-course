   body:`
# What a market is

Strip away the screens and the jargon and a market is just **a place where people who want to buy meet people who want to sell, and a price gets discovered in the process.** Everything else — exchanges, order books, high-frequency trading — is machinery built on top of that one idea.

## The two-sided problem

Imagine selling your used car. You don't actually know what it's worth, and you don't know who wants it. You could wait for the *perfect* buyer who values it exactly as you do — but they might not show up for months. Or you could drop your price until *someone* bites — fast, but you leave money on the table.

That tension — **price vs. immediacy** — is the heartbeat of every market. Sellers want a high price *and* a fast sale, but usually can't have both. Buyers want a low price *and* to buy now. The market is the mechanism that resolves this, and it does so by splitting participants into two roles.

## Makers vs. takers

This is the single most important distinction in market microstructure.

- A **maker** (liquidity provider) posts a standing offer and *waits*: "I'll sell 100 shares at £50, to whoever wants them." They provide the *option to trade* to everyone else. They get a price they like, but they pay in **patience and risk** — they don't know when (or if) someone takes them up, and the world may move against them while they wait.
- A **taker** (liquidity demander) shows up wanting to trade *right now* and accepts a price someone has already posted. They pay for **immediacy** — done instantly, but they cross the spread to do it.

\`\`\`
        MAKERS                         TAKERS
  (provide liquidity)            (consume liquidity)
  post resting orders   ──────▶  hit existing orders
        │                              │
        │  paid in patience            │  pays for
        │  + bears risk                │  immediacy
        ▼                              ▼
  ┌───────────────────────────────────────────┐
  │              ORDER  BOOK                    │
  │      price discovery happens here           │
  └───────────────────────────────────────────┘
\`\`\`

The key mental shift: **liquidity is a service one side provides and the other consumes.** The maker is *selling* immediacy; the taker is *buying* it. When we reach firms like Jane Street and Citadel Securities in M5, this is literally their business — industrial-scale makers, earning the spread for providing immediacy at enormous volume.

A subtlety: maker and taker are **roles in a given trade, not types of people.** The same trader can post a resting order (maker) on one trade and aggressively hit someone's offer (taker) on the next. The role is the action, not the actor.

## Price discovery

No central authority decrees what a stock is worth. The price **emerges** from the collision of buy and sell intentions. Every maker posting an offer casts a tiny vote about value; every taker who lifts that offer confirms or rejects it. The transaction price is the running output of that continuous negotiation.

When news breaks — a company misses earnings — no referee resets the price. Makers yank old offers and repost lower; takers who believe the news sell aggressively; the price slides until buyers and sellers rebalance at the new level. The price *discovered* the new reality through behaviour.

Two consequences that matter later:

- **Prices carry information.** A move often reflects someone knowing or believing something — which is why makers are nervous about *who* trades against them. That fear is **adverse selection**, the heart of M1.
- **A market needs both sides present.** If makers vanish, price discovery seizes up — that is exactly what a liquidity crisis or flash crash *is*.

> **Pub test:** A market matches buyers and sellers and discovers a price. **Makers** post standing offers and provide liquidity, earning a better price in exchange for patience and risk; **takers** accept those offers for immediate execution, paying for that immediacy. The price isn't set by anyone — it *emerges* from their continuous interaction. That's *price discovery*.
`},

# The limit order book

In M0.1 we said makers *post standing offers and wait*. The **limit order book** (LOB) is the thing they post into — the central data structure of a modern market. Understand the book and most of microstructure stops being mysterious.

## A limit order is three things

When a maker posts, they specify a **side** (buy/sell), a **price** (the worst price they'll accept), and a **quantity**.

"**Buy 100 @ 49.98**" means: *up to 100 shares, but I will not pay more than 49.98.* A resting promise — it sits in the book until someone trades against it or the maker cancels it (cancellation is constant; more in M1).

Contrast a **market order**: no price limit — "buy 100, whatever it costs now." That's the taker from M0.1. Limit orders *build* the book; market orders *consume* it.

## Two sides, sorted

The book has a **bid side** (resting buys) and an **ask side** (resting sells, aka *offers*), each sorted by aggressiveness.

\`\`\`
            THE LIMIT ORDER BOOK  (stock: ACME)

       BIDS (buyers)            │            ASKS (sellers)
   price    size   orders       │      price    size   orders
   ───────────────────────      │      ───────────────────────
   50.00  ◀ 1,200    3  best bid │ best ask 50.02 ▶   800    2
   49.99    3,400    7           │          50.03     2,500    9
   49.98      900    2           │          50.05     4,100   11
   49.95    5,000    4           │          50.10     1,000    3

   best bid 50.00 ──┐
                    ├─ SPREAD = 0.02  (the gap)
   best ask 50.02 ──┘
\`\`\`

**Reading the columns:** each row is one *price level*. **size** is the total shares resting there; **orders** is how many *separate* limit orders add up to that size. So \`50.00 · 1,200 · 3\` means **three different buyers** posted orders totalling 1,200 shares at 50.00. The split matters: price-time priority queues those orders *individually*, and a level held up by one big 1,200-share order behaves very differently from the same size split across many small orders that can each cancel independently — a "wall" that can evaporate in milliseconds.

- **Best bid** — the *highest* price any buyer will pay (50.00).
- **Best ask** — the *lowest* price any seller will accept (50.02).

Together they're the **top of book** (BBO). The gap, 0.02, is the **bid-ask spread** (its own lesson, M0.4). The book is "inside out": best bid is the *highest* buy, best ask the *lowest* sell — those are the orders most likely to trade. Further down each list, prices get less aggressive and less likely to execute.

## Price-time priority

Who trades first? The standard rule is **price-time priority**:

- **Price first** — a more aggressive price always wins (a buy at 50.01 jumps ahead of every buy at 50.00).
- **Time second** — at the *same* price, earliest arrival trades first.

This is why **latency matters** (a big M1 theme): at a busy price level, queue position decides whether you fill at all. A microsecond can put you ahead of thousands of shares.

## Depth, and "walking the book"

**Depth** is how much size rests at each level. It tells you how much you can trade *without moving the price much*. Send a **market buy for 2,000** into the book above:

\`\`\`
   incoming: MARKET BUY 2,000      fills against asks, cheapest first:

   ▸   800 @ 50.02   (clears the best ask)
   ▸ 1,200 @ 50.03   (eats into the next level)
       ─────────────────────────────
       2,000 shares, avg price ≈ 50.026

   AFTER: best ask is now 50.03 (1,300 left) — the price moved UP.
\`\`\`

This is **walking the book**: a large order exhausts the best level and fills at successively worse prices. Two crucial ideas:

- **Market impact / slippage** — a big order pushes the price against itself. The average fill (≈50.026) is worse than the 50.02 you saw. Bigger order vs. available depth → worse slippage. *This* is why large traders slice orders, and why "the price on the screen" is a polite fiction for size.
- **A trade removes liquidity and moves the top of book.** Every interaction reprices the book — M0.1's price discovery, now in mechanical detail.

## Marketable limit orders & partial fills

A limit order isn't always passive. Post "**buy 100 @ 50.05**" while the best ask is 50.02 and your order is **marketable** — it crosses and executes immediately against the resting asks (at 50.02, not 50.05 — you set a *ceiling*, not the price). So the same order is maker or taker depending on where you price it: **rest inside/away from the spread → maker; price across the book → taker.**

Orders can also **partially fill**: take 2,000 but only 1,500 available at acceptable prices → you get 1,500; the rest rests (limit) or cancels. Real fills are often a messy sequence of partials.

> **Pub test:** A limit order book is the sorted list of resting buys (**bids**) and sells (**asks**). The **best bid/ask** form the top of book; the gap is the **spread**. Orders trade by **price-time priority** — best price first, then earliest. A market order **walks the book**, filling against the cheapest liquidity and **moving the price** as it consumes depth — which is why large orders suffer **slippage**.
`},

# Order types, and a market order from click to settlement

Two halves: the small **order-type zoo** (you need only a handful), then the thing the M0 gate asks you to do — **trace a market order from the click to truly owning the shares.** That journey is longer and stranger than most lifelong traders realise.

## The order-type zoo (the ones that matter)

You've met the two primitives:

- **Market order** — "execute now, any price." Guarantees you *trade*; not the *price*. Exposed to slippage (M0.2 — it walks the book).
- **Limit order** — "this price or better." Guarantees the *price*; not that you *trade* (may rest forever or fill partially).

That trade-off — **certainty of execution vs. certainty of price** — is the axis the whole zoo lives on. The rest are combinations and conditions:

- **Stop order** (stop-loss) — dormant until price crosses a **trigger**, then fires as a *market* order. "If it drops to 48, get me out." Not resting visibly in the book — an instruction held until triggered. Classic risk tool, and a classic crash accelerant (cascading stops fire into a falling market).
- **Stop-limit** — same trigger, fires a *limit* order. Avoids a terrible fill, at the risk of no fill.
- **Time-in-force** — how long an order lives: **Day** (dies at close), **GTC** (good-til-cancelled, persists), **IOC** (immediate-or-cancel — fill what you can now, cancel the rest), **FOK** (fill-or-kill — all now or nothing).
- **Hidden / iceberg** — size not fully displayed (an iceberg shows a small "tip" that replenishes). How big players avoid telegraphing — relevant to adverse selection in M1.

Don't memorise these like flashcards. The model is: **every order is a position on the execution-vs-price trade-off, plus optional triggers and lifetimes.** Reason from that axis rather than reciting.

## What actually happens when you click "Buy"

You tap "buy 100 ACME." It looks instant. Underneath, the order crosses **several institutions** and splits into two very different phases — **execution** (fast, seconds) and **settlement** (slow, a day+).

\`\`\`
  YOU                                                    you own
  click ──┐                                              the shares
  "buy"   │                                                  ▲
          ▼                                                  │
   ┌─────────────┐   ┌──────────────┐   ┌──────────────┐    │
   │  1. BROKER   │──▶│  2. ROUTING   │──▶│  3. VENUE     │   │
   │  receives;   │   │  where to send │   │  matches vs   │   │
   │  best-exec   │   │  the order?    │   │  the book     │   │
   │  duty        │   │                │   │  (M0.2)       │   │
   └─────────────┘   └──────────────┘   └──────┬───────┘    │
                                                │  FILL       │
        ┌───────────────────────────────────────┘ (seconds)  │
        ▼                                                     │
   ┌──────────────┐      ┌───────────────────────────────┐   │
   │ 4. CLEARING   │─────▶│ 5. SETTLEMENT  (T+1)           │───┘
   │ CCP steps in  │      │ cash ⇄ shares actually swap    │
   │ novation +    │      │ via custodians / CSD           │
   │ netting       │      │ (DTCC, Euroclear ...)          │
   └──────────────┘      └───────────────────────────────┘

   ◀─── EXECUTION: seconds ───▶◀──── SETTLEMENT: ~1 day ────▶
\`\`\`

**1. The broker receives it.** Your broker isn't the market — they're your agent, with a legal **best-execution** duty to get you a reasonably good outcome. Retail brokers usually don't send your order straight to an exchange.

**2. Routing — the interesting decision.** The broker chooses where to send it:

- to a **public exchange** (NYSE, Nasdaq, LSE) to hit the lit book;
- to a **wholesaler / market maker** (Citadel Securities, Virtu) who *pays the broker* for the right to fill it — **payment for order flow (PFOF)**, the reason "free" apps are free. The wholesaler internalises the trade, fills you at or just better than the public best price, and keeps the spread;
- to a **dark pool** — a private venue with no visible book — to trade large size without showing it.

Where your order goes shapes the price you get. This routing layer is a big part of how Citadel Securities earns — keep it in mind for M5.

**3. The venue matches it.** Wherever it lands, your buy meets resting sells and executes by price-time priority, walking the book if large (M0.2). You get a **fill** in **milliseconds to seconds**. You've "bought" — *but you don't own the shares yet.*

**4. Clearing.** Between trade and ownership sits risk: what if the other side defaults before paying? A **central counterparty (CCP)** — the clearing house — becomes buyer to every seller and seller to every buyer (**novation**). You now depend on the CCP (which manages risk via margin + a default fund), not an anonymous stranger. It also **nets**: buy 100 and sell 60 of the same stock that day → only 40 needs to settle. That's why firms trading millions of shares settle only a fraction.

**5. Settlement.** The real swap: **cash one way, share ownership the other**, recorded at a central securities depository (DTCC in the US, Euroclear/Crest in Europe/UK) and your custodian. On a delay — **T+1** (trade date + 1 business day) for US equities since May 2024; the UK and EU move to T+1 in late 2027 (from T+2 today). Only *after* settlement are the shares irrevocably yours.

**The big idea:** a "trade" and "owning the thing" are **separate events** with a real gap between them. Execution is a fast price-discovery event; settlement is slow back-office plumbing; and **clearing** exists to manage the counterparty risk in the gap. Buying a stock isn't one instantaneous act — it's a relay race across at least four institutions.

> **Pub test (gate item):** A **market order** trades immediately at whatever the book offers; a **limit order** trades only at your price or better, and may not fill. When you click buy: your **broker** receives it and (best-execution) **routes** it — exchange, a wholesaler that paid for the flow (PFOF), or a dark pool; the **venue matches** it and returns a **fill** in seconds; a **clearing house (CCP)** novates and nets; and on **T+1**, **settlement** swaps cash for ownership via the CSD. Execution is seconds, settlement ~a day, clearing manages the risk between.
`},

# The bid-ask spread: why it exists, who earns it

This is the conceptual heart of M0. The spread (best ask − best bid) is the **price of immediacy**, and the market maker earns it by round-tripping: **buy at the bid, sell at the ask, pocket the difference.** But it is *not* free money — it's compensation for three distinct things. This decomposition is the whole game.

\`\`\`
                buy at BID 50.00        sell at ASK 50.02
   market maker ───────────────▶  +0.02 per round trip  ◀───────────────
                (to a seller)                              (to a buyer)

   the 0.02 is NOT profit — it pays for:
     1. order-processing costs   (small)
     2. inventory risk           (holding the position)
     3. adverse selection        (trading against the informed)  ← the big one
\`\`\`

## A worked example

Stock **ACME**, agreed to be worth about £100.00. The maker posts a two-sided quote:

\`\`\`
   bid  99.98   ◀── MM will BUY from you here
   ask 100.02   ◀── MM will SELL to you here
   spread = 0.04 (4p)      midpoint = 100.00
\`\`\`

**Case 1 — the happy round trip.** Two ordinary people trade for their own reasons; *neither knows anything special*:

- A **seller** hits the bid → MM **buys** 1 share at **99.98** (now *long* 1).
- Minutes later a **buyer** lifts the ask → MM **sells** it at **100.02** (now *flat*).

MM profit = 100.02 − 99.98 = **4p**. The maker provided immediacy to both sides and got paid for it. Do this thousands of times a day and it adds up.

**Case 2 — the painful trade (adverse selection).** Someone lifts the ask at **100.02** — but *they know* a broker upgrade is coming and ACME is really worth **100.50**:

- Informed trader **buys** from MM at **100.02** (MM now *short* 1 share).
- News breaks, price jumps to **100.50**; the MM must buy a share back to get flat — at **100.50**.

MM loss = 100.50 − 100.02 = **48p** — wiping out **12** happy round trips (48 ÷ 4). The cruelty: at the moment of the trade the MM *can't tell* the clueless buyer from the informed one — the orders look identical. They only find out afterwards, when the price moves against them.

**Why the spread is exactly this wide.** Suppose 1 taker in 13 is informed:

\`\`\`
   flow                     count   P&L each     subtotal
   ─────────────────────────────────────────────────────
   uninformed round trips     12      +4p          +48p
   informed trade              1     −48p          −48p
   ─────────────────────────────────────────────────────
                                     net           ≈ 0p
\`\`\`

At a 4p spread the maker roughly **breaks even** when 1-in-13 is informed. The spread isn't arbitrary — it's set so the **steady winnings from the uninformed cover the occasional beatings from the informed.** More informed flow → the maker *widens* the spread (say to 6p) or bleeds money. That is the adverse-selection component, made of arithmetic — and the formal version (how quotes update trade-by-trade) is M1.2.

## The three components

**1. Order-processing costs.** The boring fixed cost of doing business — technology, exchange fees, clearing. Once dominant, now tiny for liquid names.

**2. Inventory risk.** The instant a maker buys at the bid, they're *holding* stock, exposed to the price moving against them before they can offload it. To be coaxed into bearing that risk they demand a wider spread — and they **skew** their quotes to manage it (long too much inventory? quote a lower ask to sell it off). Inventory is *why* a maker cares about getting flat, not just about the spread.

**3. Adverse selection — the big one.** A maker quotes to *everyone*, but some takers **know something the maker doesn't** (informed traders — they've done the work, or they have an edge). When an informed trader lifts the maker's offer, the maker systematically loses: they *sold* just before the price rose. So the maker can't win against the informed. To survive, it charges everyone the spread — and profits from the **uninformed** ("noise" / liquidity traders) enough to cover what it bleeds to the informed.

> The spread is the maker's **levy on the uninformed to cover its losses to the informed.** This is the Glosten–Milgrom insight, and the direct bridge to M1's adverse selection and the Kyle model.

## Who earns it, who pays it

**Makers earn the spread; takers pay it.** But makers don't always win — they profit *on average*, winning on uninformed flow and losing on informed flow. That asymmetry is the entire risk of the market-making business (and the entire business of firms like Citadel Securities / Jane Street — M5).

It also explains **PFOF**: wholesalers fill *retail* orders *inside* the quoted spread (price improvement) precisely because retail flow is presumed **uninformed** — cheap and safe to trade against. They'd never offer that to a hedge fund.

## What moves the spread

- **Wider** with volatility, illiquidity, and information asymmetry (around earnings, news — makers pull back exactly when you most want to trade).
- **Tighter** with competition among makers, high volume, and small **tick size**.

The spread you *see* (quoted) often isn't what you *pay* (effective) — price improvement and walking the book both drive a wedge between them.

> **Pub test (gate item):** The spread is the **price of immediacy**, earned by makers round-tripping bid→ask. It compensates for order-processing costs, **inventory risk**, and above all **adverse selection** — the maker's charge to uninformed traders to cover losses to informed ones. It widens with volatility/illiquidity/information asymmetry and tightens with competition.
`},

# Asset classes: equities, bonds, FX, derivatives

The order-book mental model from M0.2 is really an **equities/futures** thing. The big lesson of this item: *other asset classes trade completely differently*, and knowing which model applies where is basic literacy an interviewer will assume.

\`\`\`
                equities        bonds            FX               derivatives
   ───────────────────────────────────────────────────────────────────────────
   where        exchange        OTC / dealer     OTC interbank    futures: exch
                (lit book)      (RFQ)            + ECNs           swaps:   OTC
   driven by    orders          quotes           quotes           mixed
   transparency high            low              medium-low       varies
   standardized fungible        bespoke          currency pairs   futures: yes
                shares          (many ISINs)                      swaps:   bespoke
   liquidity    deep per name   thin per issue   enormous         deep in the
                                                 (top pairs)      front month
   settlement   T+1             T+1 / T+2        T+2 (spot)       daily margin
\`\`\`

## The four

**Equities** — shares of ownership. **Exchange-traded, lit order book, order-driven**, standardized and fungible (one Apple share = any other), T+1. The model everything else gets compared against.

**Bonds (fixed income)** — debt (you lend; they pay coupons + principal). Mostly **OTC dealer markets**: you ask a bank for a quote (**RFQ** — request for quote), it's **quote-driven** and **opaque**, no central lit book. The kicker: one issuer floats *many* bonds (each its own ISIN, maturity, coupon), so any single bond trades **thinly**. Government bonds (gilts, Treasuries) are very liquid; corporate bonds much less. Priced in **yield**, not just price.

**FX (foreign exchange)** — currencies, traded in **pairs** (EUR/USD). The **largest market on earth** (~$7.5 trillion/day), **decentralized, OTC, 24/5**, with *no central exchange* — a network of banks (the interbank market) plus electronic venues (ECNs). Spot, forwards, swaps.

**Derivatives** — contracts whose value *derives* from an underlying. Two cultures: **futures** (exchange-traded, standardized, centrally cleared, **margined** daily) and **swaps** (mostly **OTC, bespoke**). Both deliver **leverage** and are used to **hedge** or **speculate**.

## The axes that separate them

**Exchange vs OTC/dealer · order-driven vs quote-driven · transparent vs opaque · standardized vs bespoke · concentrated vs fragmented liquidity.** Master those five axes and you can place any instrument you meet — and you'll understand why a firm's microstructure expertise in equities doesn't automatically transfer to rates or credit.

> **Pub test (gate item):** Equities trade on **exchanges via a lit, order-driven book**; bonds trade **OTC through dealers (quote-driven, opaque)**, fragmented across many issues per borrower; FX is a **decentralized, 24/5 interbank market**, the largest by volume; derivatives split into **exchange-traded futures** (standardized, cleared, margined) and **OTC swaps** (bespoke). The order-book model is an equities/futures thing — not universal.
`},

# Venues & plumbing: exchanges, brokers, clearing, settlement

This item ties together the institutions you met in M0.3 and shows the whole ecosystem. The headline: **the market isn't one place.** In the US it's deeply **fragmented** — ~16 exchanges plus dozens of dark pools and wholesalers — stitched together by regulation.

\`\`\`
   ┌──────────┐   order   ┌──────────┐  routes  ┌──────────────────────┐
   │ INVESTOR │ ────────▶ │  BROKER  │ ───────▶ │  VENUES               │
   └──────────┘           └──────────┘          │  • exchanges (lit)     │
        ▲                                        │  • dark pools / ATS    │
        │ holds shares                           │  • wholesalers (PFOF)  │
        │ (custody)                              └──────────┬───────────┘
        │                                                   │ trade
   ┌──────────┐   settle T+1   ┌──────────┐   clear  ┌──────▼──────┐
   │ CUSTODIAN│ ◀───────────── │   CSD     │ ◀─────── │    CCP       │
   │           │                │ book-entry│          │ novate + net │
   └──────────┘                └──────────┘           │ + margin     │
                                                       └─────────────┘
   all wrapped in regulation:
     SEC / FINRA (US) · FCA (UK) · ESMA (EU) · Reg NMS · MiFID II
\`\`\`

## Venues — where trades happen

- **Exchanges (lit)** — NYSE, Nasdaq, LSE, CME. Public, regulated, displayed order book.
- **Dark pools / ATSs** — private matching venues with **no pre-trade transparency**; used to trade size without showing it.
- **Wholesalers / internalizers** — fill **retail** flow off-exchange (the PFOF destination from M0.3).

Fragmentation raises an obvious problem: if a stock trades in 40 places, how do you not get a worse price than is available elsewhere? **Reg NMS** answers it with the **NBBO** (national best bid/offer) and an **order-protection rule** that forbids "trading through" a better displayed price on another venue. Europe's analogue is **MiFID II**.

## Intermediaries

- **Broker** — your agent; best-execution duty; routes your order (M0.3).
- **Market maker / dealer** — provides the liquidity (M0.4).
- **Custodian** — holds your assets safely on your behalf.

## Clearing & settlement (the back office)

- **CCP / clearing house** — NSCC (US equities), LCH, ICE Clear. **Novation** (becomes counterparty to both sides), **netting** (only net positions settle), and **margin** (collateral against the risk in the gap).
- **CSD (central securities depository)** — DTC (US), Euroclear, Crest (UK). Securities live here in **book-entry** form (no paper certificates).
- **Settlement** — cash ⇄ ownership, **T+1** for US equities (M0.3).

## Why it matters: the plumbing is invisible until it breaks

The **Feb 2021 GameStop/Robinhood** episode was exactly a **clearing-margin** event: as the stock went vertical, the CCP demanded a huge collateral deposit against Robinhood's volatile, one-directional retail buying. Robinhood couldn't post it fast enough, so it **restricted buying**. Not a conspiracy — the plumbing doing precisely what M0.6 says it does. That's the whole module made concrete.

> **Pub test:** Trading is **fragmented** across exchanges, dark pools and wholesalers, linked by **Reg NMS / the NBBO** (no trading through a better price). Your **broker** routes; a **venue** matches; a **CCP** clears (novation + netting + margin); a **CSD** records ownership and **settles** at T+1; **custodians** hold the assets — all under SEC/FINRA/FCA oversight.
`},

# Derivatives: contracts about future transactions

M0.5 gave you the textbook line: *a derivative is a contract whose value derives from an underlying.* True, and almost useless — it tells you what a derivative is named after, not what it **is**.

Here’s the version that actually helps: **a derivative is an agreement, made now, about a transaction that happens later.** The thing being traded is the *agreement itself*. Almost nobody who trades an oil future wants the barrels.

Everything else — margin, clearing, expiry, leverage — falls out of that one idea plus the practical problems of making such an agreement stick. So let’s build one from scratch rather than memorise the vocabulary.

## Start with the problem, not the product

A **farmer** will harvest 100 tonnes of wheat in September. He doesn’t know what it’ll fetch. If the price collapses he may not cover his costs.

A **miller** will need 100 tonnes of wheat in September. She doesn’t know what she’ll pay. If the price spikes her margins vanish.

They have **exactly opposite** risks. Neither of them wants a gamble — they each want *to know their number* so they can plan. So in March they agree: **in September, the farmer delivers 100 tonnes and the miller pays £200 a tonne.** No money changes hands today. That agreement is a **forward contract**, and it’s the atom of the entire derivatives world.

\`\`\`
   September spot     farmer      miller       who’d rather have
   price of wheat     receives    pays         had no contract?
   ──────────────────────────────────────────────────────────────
      £150/t            £200        £200        the miller (−£50/t)
      £200/t            £200        £200        neither
      £250/t            £200        £200        the farmer (−£50/t)
\`\`\`

Read that table carefully, because it contains the point most explanations skip. **Neither of them “won”.** One of them will always look, in hindsight, like they’d have done better without it — and that is *not* a flaw, it’s the cost of the thing they actually bought, which was **certainty**.

Notice too what happened to the risk: it didn’t disappear. It **moved**. Price risk left two people who didn’t want it and landed on… each other, cancelled out. That’s the whole purpose of derivatives, and it’s worth holding onto when the machinery gets complicated.

And notice the contract itself now has a **value** that moves. In September with wheat at £250, the miller’s right to buy at £200 is worth £50 a tonne to her. The contract started life worth nothing to either side and is now worth something — an amount *derived* from the wheat price. Hence the name.

## Two things wrong with a handshake

The forward works. It’s also fragile in two specific ways, and every piece of futures machinery exists to fix one of them.

**1. Counterparty risk.** September arrives, wheat is £250, and the farmer can sell to anyone for £250. Does he honour a £200 deal? If he refuses, or goes bust, the miller’s hedge evaporates **precisely in the state of the world where she needed it**. A hedge that fails in the bad state is not a hedge.

**2. No exit.** In June the miller’s plant burns down. She doesn’t need wheat any more, but she’s still contractually obliged to buy it. Her only ways out are to persuade the farmer to tear it up, or find someone to take her place — which needs the farmer’s agreement, because he’s relying on *her* creditworthiness, not a stranger’s.

Both flaws come from the same root: it’s a **bilateral, bespoke** contract between two named people.

## The future: an exchange fixing both

A **future** is a forward with three modifications, each one solving something above.

**1. Standardize it.** The exchange, not the counterparties, defines the contract: 100 tonnes, this grade of wheat, this delivery month, this warehouse. **Only the price is negotiable.** Now every September wheat contract is identical to every other — *fungible*, exactly like shares in M0.5 — so it can trade in an order book with all the M0.2 machinery.

That solves the exit problem in an elegant way: you don’t unwind your contract, you take **the opposite position**. Long one September contract and short one September contract cancel to nothing, and the clearing house nets them out of existence. This is **offsetting**, and it’s how the overwhelming majority of futures end — closed out before expiry, no wheat ever moved.

**2. Put a clearing house in the middle.** Once the trade is agreed, the **CCP** from M0.6 steps between the two sides by **novation**: it becomes the buyer to every seller and the seller to every buyer.

\`\`\`
   BILATERAL FORWARD                    CLEARED FUTURE

   farmer ◀──────────────▶ miller       farmer ◀──▶ CCP ◀──▶ miller

   each relies on the other             each relies only on the CCP
   the other defaults → hedge dies      CCP guarantees both sides
   exit needs the other’s consent       exit = trade the opposite
\`\`\`

Counterparty risk solved — or rather, *concentrated* into one institution built to survive it, which is a different thing and the reason CCPs are so heavily regulated.

**3. Margin and daily mark-to-market.** The clearing house has now volunteered to absorb everybody’s default risk. It is not going to do that unsecured. So it demands two things:

- **Initial margin** — a good-faith deposit, typically a few percent of the contract’s value, posted *before* you trade.
- **Variation margin** — every evening the contract is repriced and the day’s profit or loss moves **in actual cash** between accounts. Winners are paid, losers pay. If your balance falls below the **maintenance margin**, you get a **margin call**: top it up by morning or be closed out.

Why settle daily instead of at expiry? Because it stops losses quietly accumulating into a number the loser can’t pay. **The clearing house never lets anyone owe more than one day’s move.** That single design decision is why futures markets survive events that destroy OTC counterparties.

## What margin actually feels like

Concrete numbers, because this is where intuition usually fails.

A wheat future covers 100 tonnes. Wheat is £200/t, so one contract represents **£20,000** of wheat — its **notional**. Initial margin is **£1,200** (6%), maintenance margin **£900**. You **buy** one contract: you are **long**, and you profit if wheat rises.

\`\`\`
         settle   move    P&L on    margin
   day   price    per t   100 t     balance   what happens
   ─────────────────────────────────────────────────────────────────
    0    200.00      —        —      1,200    you post initial margin
    1    203.00   +3.00    +£300     1,500    £300 paid INTO your account
    2    201.50   −1.50    −£150     1,350    £150 taken out
    3    196.00   −5.50    −£550       800    below £900 → MARGIN CALL
    3′      —        —        —      1,200    you wire £400 by morning
    4    199.00   +3.00    +£300     1,500
\`\`\`

Sit with row 3. Wheat fell **2%**, from £200 to £196 — an unremarkable day — and you had to find £400 in cash the next morning or have your position liquidated. That’s **leverage**, and it isn’t a figure of speech:

\`\`\`
   you control:   £20,000 of wheat
   you posted:    £ 1,200
   ratio:         ≈ 17×      → a 6% move against you wipes out the deposit
\`\`\`

Two implications people routinely miss:

- The £300 on day 1 is **real cash in your account**, not a paper gain. Futures P&L is realised *daily*. That’s pleasant on the way up and unforgiving on the way down.
- Your deposit is **not** your maximum loss. Buy a share and the worst case is −100%; hold a future through a violent move and you can owe more than you ever put in.

## The family in one table

\`\`\`
                 who is obliged?     cash up front    traded      exit by
   ──────────────────────────────────────────────────────────────────────────
   forward      both sides, always      nothing       OTC         negotiate
   future       both sides, always      margin        exchange    offsetting
   swap         both sides, always      margin *      OTC/cleared offset/unwind
   option       one side only           premium       both        offset/expire

   * post-2008 reform pushed most standardized swaps into central clearing (M0.6)
\`\`\`

**Swaps** sound exotic and aren’t. A swap is an agreement to **exchange two streams of payments** over time. The workhorse is the **interest rate swap**: for five years, you pay a *fixed* rate and receive a *floating* rate on an agreed **notional** of, say, £10m. The notional itself never changes hands — only the difference in interest each quarter. A company with a floating-rate loan that wants certainty pays fixed on a swap; the two floating legs cancel and its borrowing is synthetically fixed.

The clean way to hold it: **a forward is one exchange in the future; a swap is a strip of forwards**, the same logic repeated every quarter.

**Options** are the odd one out — the only member where one side holds a *right* rather than an obligation. That asymmetry changes everything about how they’re priced and used, which is why they get M0.8 to themselves.

## Why anyone bothers

**1. Hedging — transferring risk you don’t want.** The farmer and the miller. An airline fixing jet fuel costs. An exporter locking tomorrow’s FX rate. A pension fund with fixed liabilities using rate swaps. The aim isn’t profit; it’s converting an unknown into a known so the *real* business can be planned.

**2. Speculation — taking risk you do want, cheaply.** To bet £20,000 on wheat physically you need £20,000 and somewhere to store 100 tonnes. In futures you need £1,200 and a brokerage account. This is often framed as the disreputable half, but it isn’t optional: **the farmer needs someone willing to take the other side**, and there aren’t always enough millers. Speculators are the counterparties that make hedging possible, and their trading is what discovers the price (M0.1).

**3. Access — the reason people forget.** Derivatives let you take positions that are awkward or flatly impossible in the underlying: **shorting** without borrowing the asset, taking a view on an *interest rate* or on *volatility* (neither of which you can hold in a warehouse), getting index exposure without buying 500 separate shares, or trading oil without a tanker.

## How they hurt people

**Leverage is symmetric.** Seventeen times up is seventeen times down, and the margin call arrives on the worst possible morning — when the market has already moved against you and cash is hardest to raise.

**Being right isn’t enough; you have to survive being right.** A hedge that is entirely correct about September can still bankrupt you in June, because the derivative marks to market **daily in cash** while the offsetting gain in your physical business only shows up **later**, at delivery. That timing mismatch — right position, wrong cash flow — has killed real companies that were, technically, hedged.

**The hedge only works if the underlying matches.** Hedge jet fuel with crude futures, because there’s no liquid jet fuel contract, and you’ve swapped price risk for **basis risk** — the risk that the thing you hedged with and the thing you own stop moving together. Basis risk is the fine print on every practical hedge.

> **Pub test:** A derivative is a contract agreed **now** about a transaction **later**; its value *derives* from an underlying, and its job is to **transfer risk** from someone who doesn’t want it to someone who’ll take it. A **forward** is a bilateral handshake — flexible, but carrying **counterparty risk** and no way out. A **future** is the exchange’s fix — **standardized** (so it’s fungible and you exit by **offsetting**), **novated to a clearing house** (so nobody relies on a stranger), and therefore **margined and marked-to-market daily**. A **swap** is a strip of forwards on payment streams. Margin creates **leverage** — you control the full notional on a few percent deposit, so you can lose more than you put in.
`},

   source:"John Hull, *Options, Futures, and Other Derivatives*, ch.10–12 (mechanics and properties of options). Read the payoff diagrams closely and skip the mathematics on a first pass — the asymmetry does more work than the algebra. Pricing is deliberately deferred to M2–M3.",
   body:`
# Options: the right, not the obligation

Every contract in M0.7 obliges **both** sides. The farmer must deliver, the miller must pay, and the future is just that arrangement industrialised. An option breaks that symmetry, and it’s the only member of the family that does. Get the asymmetry and the premium, the jargon and the odd hockey-stick payoff all follow from it.

## The two words that define it

An option gives its **buyer** the *right, but not the obligation*, to trade the underlying at a fixed price (the **strike**) by a fixed date (the **expiry**). The **seller** — the *writer* — has no such luxury: if the buyer chooses to **exercise**, the writer must deliver.

- A **call** is the right to **buy** at the strike.
- A **put** is the right to **sell** at the strike.

If the memory hook helps: you *call* the asset away from the writer, or you *put* it to them.

## Why the premium exists

A future costs nothing to enter. That’s not a promotional offer — it’s because the deal is *symmetric*: at the agreed price, both sides face the same shape of risk, so neither owes the other anything to get started.

An option is not symmetric at all. The buyer keeps every bit of the upside and simply walks away from the downside. The seller has the mirror image: a capped gain and a large, sometimes unlimited, loss. **Nobody takes that side for free.** So the buyer pays a **premium** on day one.

That’s the whole reason an option costs money up front, and it’s worth stating plainly because it’s often mistaken for a transaction fee. It isn’t a fee. **The premium is the price of the asymmetry.**

## What it looks like with numbers

ACME trades at **£100**. You buy a **call**: strike **£100**, three months to expiry, premium **£5** per share.

\`\`\`
   ACME at expiry    exercise?    payoff    premium     net P&L
   ─────────────────────────────────────────────────────────────
      £ 80              no         £  0       −£5        −£5
      £ 95              no         £  0       −£5        −£5
      £100              no *       £  0       −£5        −£5
      £105             yes         £  5       −£5         £0    ◀ breakeven
      £120             yes         £ 20       −£5       +£15
      £200             yes         £100       −£5       +£95

   * at exactly the strike, exercising gains you nothing
\`\`\`

Three things fall straight out of that table:

- **Your loss is capped at the premium.** ACME can go to zero; you lose £5 and no more, because you are never forced to buy.
- **Your gain has no ceiling.** That open-ended upside is precisely what the £5 bought.
- **Breakeven is the strike *plus the premium* — £105, not £100.** This catches almost everybody once: being *right* that ACME would rise, and watching it reach £103, still loses money.

Drawn out, it’s the shape every options textbook opens with:

\`\`\`
   LONG CALL — strike £100, premium £5

      +15┤                            ╱  upside open
         │                         ╱
         │                      ╱
        0┼───────────────────╱─────────────  breakeven £105
       −5┤━━━━━━━━━━━━━━━━╱
         └────┬─────┬─────┬─────┬─────┬───▶  ACME at expiry
             80    90    100   110   120

   flat line on the left = loss floored at the premium, forever
\`\`\`

The **put** is the mirror. Buy a put at strike £100 for £5 and you break even at **£95**, your loss is again capped at the £5, and you gain as ACME falls — up to a maximum of £95 if the company goes to zero. Not unlimited, because a share price can’t go below nothing.

## Four positions, not two

Every option has two sides, so the basic vocabulary is four positions. This table repays memorising:

\`\`\`
                          you want         max gain          max loss
   ────────────────────────────────────────────────────────────────────
   long  call  (buy)    price up, a lot    unlimited          premium
   long  put   (buy)    price down, a lot  strike − premium   premium
   short call  (sell)   price flat/down    premium            UNLIMITED
   short put   (sell)   price flat/up      premium            strike − premium
\`\`\`

The rows pair off exactly: the buyer’s loss is the seller’s gain, penny for penny. Between the two parties an option is strictly **zero-sum**.

Look hard at the short rows, because they explain why selling options is so seductive and so dangerous. **Max gain = the premium.** You collect a small sum very often, and pay out a large one rarely. Sold with discipline that’s a real business — it’s the same payoff shape as market making in M0.4, where steady winnings from uninformed flow cover occasional beatings from the informed. Sold *without* discipline, it looks like free money right up until the day it isn’t.

## The vocabulary, briefly

- **In the money (ITM)** — exercising right now would pay: a call with spot above the strike, a put with spot below it.
- **Out of the money (OTM)** — it wouldn’t. If nothing changes, the option expires worthless.
- **At the money (ATM)** — spot is roughly at the strike.
- **European** vs **American** — exercisable *only at expiry*, or *any time before it*. Nothing to do with geography.
- **Intrinsic value** — what the option would pay if exercised this instant (never less than zero). **Time value** — everything else in the premium: the chance things improve before expiry.

**Premium = intrinsic + time value**, and time value grinds down to exactly zero at expiry. An option is a wasting asset; the buyer is fighting the clock and the seller is being paid by it.

## What moves the premium

You don’t need the pricing formula to reason about direction. Five things move the price of a call:

\`\`\`
   more time to expiry     ▲    more chances to end up in the money
   more volatility         ▲    bigger swings — see below
   spot rises vs strike    ▲    more likely, and more deeply, ITM
   higher interest rates   ▲    mild: paying the strike later is worth more
   dividends coming        ▼    the option holder doesn’t receive them
\`\`\`

The one genuinely worth internalising is **volatility raises the price of calls *and* puts alike**, which sounds wrong the first time you hear it. It follows from the asymmetry: the downside is already floored at the premium, so widening the range of possible outcomes only fattens the tail you actually get paid on. A more volatile stock is a more valuable thing to hold an option on, whichever way the option points.

Which means an option is, in a real sense, **a position on volatility itself** rather than only on direction — you can be right about where ACME ends up and still lose, or wrong about direction and win, depending on what happened to volatility in between.

That is the doorway to the rest of the course, and it’s where M0 deliberately stops. Turning that intuition into an actual number is **Black–Scholes**; running it backwards — taking the market price and asking what volatility would justify it — gives **implied volatility**; and measuring how the price responds to each input gives **the greeks**. All three need machinery M0 hasn’t built, so they wait for M2 and M3.

> **Pub test:** An option is the **right, but not the obligation**, to buy (**call**) or sell (**put**) an underlying at a fixed **strike** by a fixed **expiry** — the only derivative where one side gets to choose. Because the buyer’s payoff is **asymmetric** (loss capped at the **premium**, upside open) nobody sells that for free, so the buyer pays up front — which makes **breakeven the strike ± the premium**, not the strike. Four positions — long call/put (pay premium, limited loss) and short call/put (collect premium, large loss). Premium = **intrinsic + time value**, and it rises with **time** and **volatility** — so an option is partly a bet on volatility, not just direction.
`},

# The microstructure lens

M0 taught you the machinery: the book, the spread, the path from click to settlement. M1 asks a different question — **why does that machinery behave the way it does?** — and it requires one shift in how you look at the book.

In M0, the order book was **plumbing**: a data structure that sorts orders and matches them. In M1, the order book is an **inference engine**: a public, continuously revised estimate of what the asset is worth, updated by what people do.

That sentence is the whole module. Everything below is machinery for taking it seriously.

## Three questions M0 couldn’t answer

Market microstructure is the study of how the *mechanism* of trading affects the prices that come out of it. Three questions define the field:

1. **Why does the price you transact at differ from the value?** M0.4 answered “the spread,” and decomposed it. M1 derives it.
2. **Why does trading itself move the price?** Not the news — the *trade*. A large buy pushes the price up even when nothing about the company has changed. Why should the market care that *you* bought?
3. **Why does liquidity evaporate precisely when it’s wanted?** Spreads widen and depth vanishes in exactly the moments — earnings, shocks, crises — when people most need to trade.

Notice all three are about the *gap* between value and price. Classical finance assumes that gap away. Microstructure is the study of the gap.

## The organising split: informed vs uninformed

Everything in M1 rests on dividing order flow in two.

\`\`\`
   INFORMED FLOW                     UNINFORMED FLOW
   ─────────────────────────────────────────────────────────────
   knows something the maker         trades for reasons
   doesn’t — earnings, a model,      unrelated to value —
   a client order, faster data       rebalancing, a house
                                     deposit, an index change
   trades in ONE direction,          direction is essentially
   correlated with the truth         a coin flip
   the maker LOSES to them           the maker WINS from them
   also called: “toxic” flow         also called: noise, or
                                     liquidity traders
\`\`\`

Two things about this split are easy to say and hard to keep hold of:

**Neither wears a badge.** At the instant a buy order arrives, it is a buy order. The maker sees identical bytes whether it came from a hedge fund with a signal or a dentist with a bonus. This is the fact that generates almost every result in M1 — if makers could tell them apart, they would simply quote a tight market to one and refuse the other, and there would be no spread to speak of.

**“Informed” doesn’t mean insider.** It means *anything the maker doesn’t know yet* — a better model, a faster feed, a view on where a big parent order is heading. Most informed flow is entirely legal and quite mundane.

The maker’s whole problem reduces to one line: **quote to everyone, and learn from who takes you up.**

## What “the book is a belief” means

Take that seriously and the numbers on the screen change meaning.

\`\`\`
   what you see            what it actually is
   ─────────────────────────────────────────────────────────────
   the midpoint      ≈  the market’s expected value of the asset,
                        CONDITIONAL on everything it has seen —
                        including the order flow so far
   the spread        ≈  the price of being wrong about that estimate
   the depth         ≈  how confident the market is / how much
                        noise there is to hide in  (this is M1.4’s λ)
   a trade           ≈  EVIDENCE. Not just an event.
\`\`\`

That last row is the hinge of the module. A buy order is weak evidence the asset is worth more than the maker thought — because informed traders buy when it is, and uninformed traders buy at random. So a rational maker, seeing a buy, must *raise its estimate*, even having learned nothing about the company.

This is why trading moves prices even with no news, and it is not a market failure. It’s Bayes’ theorem running in public, one order at a time. M1.2 writes the update down.

## Three forces, three models

A real spread is set by several pressures at once. The literature’s strategy — and this module’s — is to isolate them one at a time by building a model that switches the others off.

\`\`\`
   model            isolates          switched off        result
   ────────────────────────────────────────────────────────────────────
   Glosten–Milgrom  information       maker is risk-      spread = μ × the
   (M1.2)           / learning        neutral, holds      range of value;
                                      no inventory        quotes are
                                                          conditional
                                                          expectations

   Ho–Stoll         inventory risk    nobody is           quotes SKEW with
   (M1.3)                             informed            the maker’s
                                                          position

   Kyle (1985)      a STRATEGIC       one informed        depth λ; price
   (M1.4)           informed trader   trader, who         impact is LINEAR
                                      chooses his size    in order flow
\`\`\`

Hold on to what each one throws away, because that’s what makes each tractable — and it’s the honest answer to “which model is right?” None of them. Each is a clean statement of one force. Real quotes carry all three, which is exactly the three-part decomposition you already met in M0.4: order-processing, inventory, adverse selection.

M1.5 then asks what survives contact with data, and M1.6–M1.7 ask what the firms who live in this layer actually optimise.

## Order-driven and quote-driven, revisited

One recap worth making explicit, because M1 slides between them. In an **order-driven** market (M0.2’s book) there is no designated maker — liquidity is whatever limit orders happen to be resting, posted by anyone. In a **quote-driven** market (M0.5’s bond dealers) a designated dealer is obliged to show a two-sided price.

The models in M1 are written in the language of a single **representative market maker** setting a bid and an ask. That is literally true in a quote-driven market and a useful fiction in an order-driven one, where “the maker” stands in for the competing crowd of limit-order posters at the top of the book. The economics carry over; the institution doesn’t.

> **Pub test:** Microstructure asks why the price you get differs from the value, why trading itself moves prices, and why liquidity vanishes when you most need it. The organising split is **informed vs uninformed flow** — and the maker can’t tell them apart at the moment of the trade. So the book stops being plumbing and becomes a **belief** — the midpoint is roughly the market’s expectation of value *conditional on the order flow so far*, and every trade is evidence that updates it. Three models isolate three forces — **Glosten–Milgrom** (learning), **Ho–Stoll** (inventory), **Kyle** (a strategic informed trader) — and a real spread is all three at once.
`},

# Adverse selection, formally (Glosten–Milgrom)

M0.4 gave you adverse selection as arithmetic: if 1 taker in 13 is informed, a 4p spread roughly breaks even. That was a *consistency check* on a number pulled from the air. Glosten and Milgrom (1985) turn it round and **derive** the number, and the result is clean enough to remember for life.

The trick is a single change of question. Don’t ask “what spread breaks even on average?” Ask:

> **What price would break even given that someone just chose to buy?**

That conditioning is everything. The maker who ignores it goes broke.

## The setup

Strip the world down as far as it goes:

- The asset is worth either **V_H** (high) or **V_L** (low). Nobody knows which yet; the prior is **π** on V_H. Start with **π = ½**.
- A fraction **μ** of traders are **informed** — they know V exactly. They buy if V = V_H, sell if V = V_L. Always.
- The remaining **1 − μ** are **uninformed**. They buy or sell with probability ½ each, for reasons unrelated to V.
- The maker is **risk-neutral**, holds no inventory, has no costs, and faces **perfect competition** — so it earns exactly zero expected profit.
- Trades arrive one at a time, size fixed at one unit.

Everything M1.3 cares about is switched off here: no risk aversion, no inventory. This model is *only* about information.

## Zero profit, conditionally

Competition drives expected profit to zero. But zero profit **on each side separately, conditional on that side being hit** — because the maker learns something from being hit:

\`\`\`
   ask = E[V | the next trade is a BUY]
   bid = E[V | the next trade is a SELL]
\`\`\`

If the maker set both to the unconditional E[V], it would sell to informed buyers whenever V = V_H and buy from informed sellers whenever V = V_L, losing on every informed trade and never recovering it. **The spread exists because a buy and a sell carry different information.**

## The Bayes update

Two conditional probabilities do all the work. Given the true value is high, who buys?

\`\`\`
   P(buy | V_H)  =  μ·1  +  (1−μ)·½   =  (1 + μ) / 2
                    ▲         ▲
                    │         └─ the uninformed, flipping a coin
                    └─ every informed trader buys

   P(buy | V_L)  =  μ·0  +  (1−μ)·½   =  (1 − μ) / 2
\`\`\`

Now Bayes, with prior π = ½ so the halves cancel:

\`\`\`
                        P(buy | V_H)·π
   P(V_H | buy)  =  ─────────────────────────────────────
                    P(buy | V_H)·π + P(buy | V_L)·(1−π)

                        ½·(1+μ)/2                 1 + μ
                 =  ─────────────────────────  =  ─────
                    ½·(1+μ)/2 + ½·(1−μ)/2           2
\`\`\`

A pleasantly tidy result: **after a buy, the probability the asset is worth V_H is (1 + μ)/2.** By symmetry, after a sell it is (1 − μ)/2.

## The spread falls out

Quotes are expectations under those posteriors:

\`\`\`
   ask = E[V | buy]   =  (1+μ)/2 · V_H  +  (1−μ)/2 · V_L
   bid = E[V | sell]  =  (1−μ)/2 · V_H  +  (1+μ)/2 · V_L
   ────────────────────────────────────────────────────────
   spread = ask − bid =  μ · (V_H − V_L)
\`\`\`

**The spread is the fraction of informed flow times the range of possible value.** Two limits are worth saying out loud:

- **μ → 0** (nobody informed) → **spread → 0.** With no adverse selection, competitive makers quote a zero spread. Every penny of a real spread is paid for by *someone’s* information (or by inventory risk and costs, which this model deleted).
- **μ → 1** (everybody informed) → **spread → the whole range.** The quotes reach V_H and V_L, no uninformed trader will touch them, and the market effectively **shuts**. Markets need noise traders to exist. That is not a cynical remark — it is a theorem.

## The same numbers as M0.4

Put V_H = 110, V_L = 90 and μ = 0.2 into the machine:

\`\`\`
   P(V_H | buy)  = (1 + 0.2)/2 = 0.60
   ask           = 0.60 × 110 + 0.40 × 90  = 102
   bid           = 0.40 × 110 + 0.60 × 90  =  98
   spread        = 4  =  0.2 × 20   ✓
\`\`\`

A £4 spread on a £100 asset, and it isn’t a convention or a fee — it is what 20% informed flow costs, given the asset might be worth 90 or 110.

## The book learns

Here is the part that makes this more than a spread formula. The posterior after a trade becomes the **prior for the next one**, so quotes walk. Continue the example — same μ = 0.2, same V_H/V_L — and feed it a buy, a buy, then a sell:

\`\`\`
   trade      prior π    P(V_H|·)    new mid    bid      ask
   ─────────────────────────────────────────────────────────────
   (start)     0.500        —         100.00    98.00   102.00
   BUY         0.500      0.600       102.00   100.00   103.85
   BUY         0.600      0.692       103.85   102.00   105.43
   SELL        0.692      0.600       102.00   100.00   103.85
\`\`\`

Read the third row: two buys in a row and the *bid* is now 102.00 — exactly the **ask** you could have lifted at the start. The maker will now happily buy from you at the price it was selling at two trades ago. Nobody announced anything. No news broke. The market revised its belief because **buying is evidence**, and the mechanism is nothing more than repeated Bayes.

Two consequences to carry forward:

- **This is price discovery, mechanised.** M0.1 said price “emerges from the collision of buy and sell intentions.” This is that sentence with the arithmetic filled in.
- **This is where *permanent* price impact comes from.** The move after a buy does not revert, because the belief genuinely changed. M1.3’s inventory effects *do* revert. Telling those two apart is the whole subject of M1.5.

(One honest caveat: the clean \`spread = μ·(V_H − V_L)\` holds at π = ½. Away from a 50/50 prior the spread is (V_H − V_L)·[P(V_H|buy) − P(V_H|sell)], which is what generated the rows above — it narrows as the market becomes confident. The intuition survives; the tidy formula is a special case.)

## What the model buys you

**Spreads widen before earnings** because μ rises — more people plausibly know something. Makers aren’t being opportunistic; they are being solvent.

**Retail flow is cheap to trade against** because it is close to μ = 0. This is the entire economic basis of PFOF from M0.3: wholesalers pay for flow whose informedness is low and predictable, and can therefore quote inside the public spread.

**Illiquid names have wide spreads** partly because (V_H − V_L) is large — the range of defensible values for a thinly-covered small cap is simply wider.

**A market can fail entirely.** As μ → 1 there is no price at which a maker will trade. Every liquidity crisis has this shape: not an absence of buyers, but an inability to quote to a pool of counterparties who might all know something.

What the model *doesn’t* give you: any role for trade **size**. Every trade here is one unit, and the informed trader has no choice to make — he buys, or he sells. Let him choose *how much*, and you get Kyle (M1.4).

> **Pub test:** A competitive risk-neutral maker must break even **conditional on the direction of the trade**, so its quotes are conditional expectations — ask = E[V | a buy arrives], bid = E[V | a sell arrives]. Work the Bayes update through and with a 50/50 prior the spread collapses to **μ × (V_H − V_L)** — the fraction of informed flow times the range of possible value. No informed traders, no spread. All informed traders, and the market shuts. Because each quote is a posterior, the book **learns** — every buy ratchets both quotes up, which is price discovery as Bayesian updating and the origin of *permanent* price impact.
`},

   body:`
# Inventory models: the maker as a risk manager

Glosten–Milgrom explained spreads with information. Now switch information off completely — **nobody is informed**, every trader is noise, no order tells the maker anything about value.

Spreads still exist. Something else is going on, and M0.4 already named it: **inventory risk**. This lesson is that component, done properly.

The reason it deserves its own model is that it produces price behaviour that looks identical to information on a chart and is economically its opposite. Telling them apart is a live problem, and M1.5 is entirely about it.

## The maker’s real problem

A maker who buys at the bid is not sitting on a profit. It is sitting on **a position it did not want**, exposed to the price moving before it can get flat. Do that a few hundred times in one direction and the accumulated position, not the spread, dominates the P&L.

So the maker is not neutral about which side it trades. It is *actively steering*. Ho and Stoll (1981) formalise this by making the maker **risk-averse** and asking what quotes it should post given the position it already has.

## Deriving the skew

Take a maker with constant absolute risk aversion, \`U(x) = −exp(−γx)\`, currently holding **q** units of an asset whose price is a random walk with variance rate **σ²**, over a horizon **τ** until it expects to be flat.

Under CARA with normal outcomes, the certainty equivalent is mean minus half gamma times variance:

\`\`\`
   holding q units to the horizon:

     E[terminal wealth]   =  q·S
     Var[terminal wealth] =  q²σ²τ

     CE(q)  =  q·S  −  ½ γ q² σ² τ
                        ─────────────
                        the risk penalty — QUADRATIC in position
\`\`\`

The maker’s **reservation price** for one more unit is the price at which it is indifferent between holding q and holding q + 1 — the most it would pay, or the least it would accept:

\`\`\`
   r  =  CE(q+1) − CE(q)
      =  S  −  ½γσ²τ·[(q+1)² − q²]
      =  S  −  ½γσ²τ·(2q + 1)
      ≈  S  −  γ q σ² τ            (for one unit against a large q)
   ────────────────────────────────────────────────────────────────
                  r  =  S  −  γ q σ² τ
\`\`\`

That single term \`γqσ²τ\` is the whole lesson. Read it slowly:

- **Linear in inventory q**, and *signed*. Long → reservation price below mid → the maker shades its quotes **down** so its ask gets hit and it sheds risk. Short → shades up. Flat → quotes symmetric about the mid.
- **Linear in variance σ²**, so *quadratic* in volatility. Double the volatility and the skew quadruples. This is why makers pull in hard when things get noisy.
- **Linear in horizon τ.** Risk you must carry longer costs more, which is exactly why makers flatten into the close — as τ → 0 the penalty vanishes, and a position held overnight has a much larger τ.
- **γ is the maker’s own risk aversion**, not a property of the market. Two makers facing identical books will quote differently, which is *why* there is competition to model.

## What it feels like in numbers

Stock at **£100**, daily volatility **2%** so σ = £2 and σ² = 4, horizon **τ = 1 day**, risk aversion **γ = 10⁻⁵**.

\`\`\`
   inventory q     σ (daily)    skew = γqσ²τ    maker quotes centred on
   ──────────────────────────────────────────────────────────────────────
        0            £2            0            100.00   (symmetric)
   +5,000 long       £2          −£0.20          99.80   (leaning to SELL)
  +10,000 long       £2          −£0.40          99.60
   −5,000 short      £2          +£0.20         100.20   (leaning to BUY)
   +5,000 long       £4          −£0.80          99.20   ◀ vol doubled,
                                                             skew ×4
\`\`\`

The mid is still 100.00 in every row. **The market’s belief about value has not moved at all.** What moved is one maker’s willingness to hold more of it.

## The distinction that matters most in M1

\`\`\`
   ADVERSE SELECTION (M1.2)          INVENTORY (M1.3)
   ─────────────────────────────────────────────────────────────────
   the maker LEARNED something       the maker learned NOTHING
   the MID moves                     the mid stays; QUOTES skew
                                     around it
   driven by the market’s belief     driven by one participant’s
   about value                       position and risk appetite
   the move is PERMANENT             the move MEAN-REVERTS once
                                     the maker is flat again
   compensation for being picked     compensation for warehousing
   off by the informed               risk nobody else wanted
\`\`\`

That third pair of rows is the one to keep. **Information changes the price. Inventory changes who wants to trade at it.** On a chart both look like “price went down”; only one of them stays down.

This is also the honest reason a real spread can’t be read off either model. M0.4’s three components are: order-processing (small, boring), inventory (this lesson), and adverse selection (M1.2). A live quote carries all three at once, and decomposing an observed spread into them is an empirical problem, not an algebraic one.

## Amihud–Mendelson: illiquidity has a price

Ho–Stoll is about one maker on one day. Amihud and Mendelson (1986) ask the cross-sectional question: **if trading costs money, what does that do to asset prices?**

The argument is short. If you must pay half the spread to get in and half to get out, your net return is the gross return minus the round trip. Rational investors will only hold a wide-spread asset if its **gross** return is high enough to compensate. So:

> **Illiquidity is priced.** In equilibrium, assets with wider spreads must offer higher expected gross returns — an *illiquidity premium*.

With a genuinely useful corollary, the **clientele effect**: the cost is paid per round trip, so it is amortised over your holding period. A trader turning over daily cannot afford a wide spread; a pension fund holding for a decade barely notices it. Illiquid assets therefore migrate to long-horizon holders, and each asset ends up with the clientele whose horizon matches its spread.

This is where microstructure stops being a story about plumbing and starts affecting **what things are worth** — a wider spread doesn’t just cost you on the way in, it permanently lowers the price everyone will pay.

> **Pub test:** Switch information off entirely and spreads still exist, because a **risk-averse** maker holding a position wants out. For CARA utility and normal returns the certainty equivalent of holding q units is qS − ½γq²σ²τ, so the maker’s **reservation price** is r = S − **γqσ²τ** — it shades its whole quote away from its position, linearly in inventory and in *variance*. Crucially this is **not** a belief about value, so inventory-driven moves **mean-revert** once the maker gets flat, while Glosten–Milgrom’s information-driven moves are **permanent**. Amihud–Mendelson takes it cross-sectional — illiquidity is priced, so wide-spread assets must offer higher gross returns, and long-horizon investors hold them.
`},

# The Kyle (1985) model

Glosten–Milgrom’s informed trader has no decisions to make. He knows the value, so he buys or he sells, one unit, and the model is about what the maker infers. But a real informed trader faces the interesting question: **how much should I trade?**

Trade too little and you leave money on the table. Trade too much and you move the price against yourself — and worse, you *reveal* yourself, because the maker is watching the flow. Kyle (1985) is that trade-off solved exactly, and it produces the single most-used object in microstructure: **λ**, the price-impact coefficient.

## The setup

One round of trading. Three players:

\`\`\`
   the INFORMED TRADER   knows the true value v, drawn v ~ N(p₀, Σ₀).
                         Chooses a quantity x. Risk-neutral.

   the NOISE TRADERS     submit a random net quantity u ~ N(0, σ²ᵤ),
                         independent of v. They are not optimising;
                         they are the camouflage.

   the MARKET MAKER      sees ONLY the total order flow y = x + u —
                         never the split — and, being competitive
                         and risk-neutral, sets p = E[v | y].
\`\`\`

The single most important line there is that the maker sees only **y**. It cannot tell a large informed buy from a run of lucky noise. That is the informed trader’s entire opportunity, and the reason he is willing to trade at all.

Note what’s switched off relative to M1.3: the maker is risk-neutral again and holds no inventory. Kyle is a pure-information model like Glosten–Milgrom — the new ingredient is *strategy*.

## Conjecture, optimise, close the loop

The standard method: guess that both sides play **linear** strategies, solve each side’s problem taking the other as given, then demand the guesses be mutually consistent.

\`\`\`
   informed trader:   x  =  β·(v − p₀)      trade proportional to your edge
   market maker:      p  =  p₀ + λ·y        price linear in total flow
\`\`\`

**Step 1 — the informed trader’s optimum.** His profit is the edge he captures on the quantity he trades, at the price his own trading creates:

\`\`\`
   π  =  (v − p)·x  =  (v − p₀ − λ(x + u))·x

   E[π | v]  =  (v − p₀)·x  −  λx²          (E[u] = 0)

   dE[π]/dx  =  (v − p₀) − 2λx  =  0

   ⟹   x*  =  (v − p₀) / (2λ)      so      β = 1/(2λ)
\`\`\`

Already worth pausing on. The informed trader does **not** trade until the price reaches v — that would be x = (v − p₀)/λ. He trades exactly **half** that. The λx² term is his own market impact biting him, and the optimum splits the difference between edge and impact.

**Step 2 — the maker’s zero-profit condition.** Setting p = E[v | y] with everything jointly normal makes this a linear regression of v on y:

\`\`\`
   λ  =  Cov(v, y) / Var(y)

   y = β(v − p₀) + u   ⟹   Cov(v,y) = βΣ₀ ,  Var(y) = β²Σ₀ + σ²ᵤ

   λ  =  βΣ₀ / (β²Σ₀ + σ²ᵤ)
\`\`\`

**Step 3 — the fixed point.** Substitute β = 1/(2λ) and solve for λ:

\`\`\`
   λ  =  (Σ₀/2λ) / (Σ₀/4λ² + σ²ᵤ)

   λ·(Σ₀/4λ² + σ²ᵤ)  =  Σ₀/2λ

   Σ₀/4λ + λσ²ᵤ      =  Σ₀/2λ

   λσ²ᵤ              =  Σ₀/4λ

   λ²                =  Σ₀ / (4σ²ᵤ)
   ─────────────────────────────────────────────────
        λ  =  ½·√(Σ₀ / σ²ᵤ)        β  =  √(σ²ᵤ / Σ₀)
\`\`\`

## Reading the result

**Price impact is linear.** p moves by λ per unit of net order flow, regardless of size. Not concave, not stepped — linear. Kyle’s λ is what people mean by “market impact” in a thousand execution papers, and it is why a single number can stand in for a market’s resilience.

**Depth is 1/λ = 2·√(σ²ᵤ/Σ₀), a ratio of noise to uncertainty.**

\`\`\`
   more noise-trader volume σ²ᵤ   →   λ falls   →   DEEPER market
   more uncertainty about v Σ₀    →   λ rises   →   THINNER market
\`\`\`

Both directions are intuitive once said aloud. Noise is **camouflage**: the more of it there is, the more the informed trader can hide, so the less any given order tells the maker, so the less the maker must move. Uncertainty is the opposite: when nobody knows what the asset is worth, every order is informative and the maker flinches.

That is the sentence to keep. **Depth is not “how much money is resting in the book.” Depth is how hard it is to tell information from noise.**

**Exactly half the information reaches the price.** Compute the maker’s residual uncertainty after seeing the flow:

\`\`\`
   β² = σ²ᵤ/Σ₀   ⟹   β²Σ₀ = σ²ᵤ   ⟹   Var(y) = 2σ²ᵤ
   Cov(v,y) = βΣ₀ = √(σ²ᵤΣ₀)

   Var(v | y)  =  Σ₀ − Cov²/Var(y)  =  Σ₀ − σ²ᵤΣ₀/(2σ²ᵤ)  =  Σ₀/2
\`\`\`

The informed trader trades precisely enough to halve the market’s variance about the true value, and keeps the other half. It isn’t a coincidence or a tuned parameter — it drops out of the optimisation. Information enters prices *because* someone profits by putting it there, and only ever partially, because full revelation would destroy the profit that motivated it.

## A worked feel for λ

Suppose the market is unsure about a £100 stock to the tune of Σ₀ = 4 (so a standard deviation of £2), and noise flow has σ²ᵤ = 10⁶ (σᵤ = 1,000 shares).

\`\`\`
   λ  =  ½·√(4 / 10⁶)  =  ½ × 0.002  =  0.001 £/share

   ⟹  a net 1,000-share buy moves the price  £1.00
   ⟹  depth 1/λ = 1,000 shares per £1 of price move
   ⟹  informed trader with v = £103 trades β(v−p₀)
        = √(10⁶/4) × 3 = 500 × 3 = 1,500 shares
        ...pushing the price to about £101.50, halfway to the truth
\`\`\`

Now quadruple the noise, σᵤ = 2,000: λ halves to 0.0005, and the same informed trader doubles his size to 3,000 shares. **More liquidity invites more informed trading** — the two grow together, which is why deep markets are not naive markets.

## What Kyle gives you, and what it doesn’t

It gives you the vocabulary that execution desks actually use: λ, market depth, linear impact, hiding in volume. It explains why big orders are **sliced** — impact is paid on each unit of *net flow*, so spreading a parent order across time (and across the noise arriving in that time) is worth real money. The multi-period version of the model makes this precise: the informed trader releases his information at a constant rate, trading so as to keep the market permanently unable to distinguish him.

What it doesn’t give you is **the square-root law**. Kyle says impact is linear in size; four decades of data say it goes roughly as √size. That gap between the cleanest model in the field and the most robust empirical regularity in the field is not a footnote — it is the subject of M1.5.

> **Pub test:** Kyle lets the informed trader choose *how much* to trade, and hide inside noise-trader flow the maker can’t separate. Conjecture linear strategies — x = β(v − p₀) and p = p₀ + λy on total flow y = x + u — solve the informed trader’s optimum against the maker’s zero-profit condition, and the fixed point gives **λ = ½·√(Σ₀/σ²ᵤ)** with β = √(σ²ᵤ/Σ₀). So **price impact is linear** in order flow, and **depth 1/λ is the ratio of how much noise there is to hide in against how much is unknown about value**. The informed trader trades exactly enough to leave Var(v|y) = Σ₀/2 — **half his information reaches the price**, and he keeps the rest by trading smaller.
`},
