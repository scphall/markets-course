   body:`
# Price impact in practice

Kyle gave us a clean, derivable answer: impact is **linear** in order flow, at rate λ. It is the most-cited result in the field, and it is empirically **wrong** — in an interesting way.

This lesson is the collision between the two cleanest things in microstructure: the best model and the most robust measurement. Neither survives intact.

## First, split the impact in two

Before measuring anything, separate two effects that a price chart hopelessly conflates. You buy a large parent order over an hour. The price rises. You stop. Some of the rise stays; some of it drains away.

\`\`\`
   price
     │                    ╭─────╮
     │                ╭───╯      ╰────╮
     │            ╭───╯                ╰──────────────  ← permanent
     │        ╭───╯                                        component
     │  ──────╯
     │
     └──────┬──────────────────┬─────────────────────▶ time
         you start          you stop

     the hump you push up while trading  =  TEMPORARY impact
     the level it settles at afterwards  =  PERMANENT impact
\`\`\`

The two have completely different causes, and you already have both models:

\`\`\`
   PERMANENT  ← Glosten–Milgrom (M1.2).  The market inferred information
                from your flow and genuinely revised its belief. It does
                not revert, because nobody thinks they were wrong.

   TEMPORARY  ← Ho–Stoll (M1.3).  You consumed resting liquidity and left
                makers holding inventory they didn’t want, so they skewed
                their quotes. As they work back to flat, it decays.
\`\`\`

This is why M1.3 insisted on the distinction. **Permanent impact is the price of being informative; temporary impact is the price of being in a hurry.** You can reduce the second by trading patiently. You cannot reduce the first at all — if your trading genuinely predicts the future, the market is right to move against you, and that cost is inseparable from having alpha in the first place.

## The square-root law

Now measure it. Across equities, futures, FX, options, across decades, across venues, one relationship keeps showing up:

\`\`\`
              ΔP  ≈  Y · σ · √( Q / V )

     ΔP  price move caused by the order (in the same units as σ)
     σ   the asset’s daily volatility
     Q   the size of your parent order
     V   the asset’s average daily volume
     Y   a constant of order ½ to 1, mildly venue- and asset-dependent
\`\`\`

Note what it does *not* contain: any parameter fitted per stock beyond the two you already know (σ and V), and any hint of Kyle’s linearity. The dependence on size is **concave** — the marginal cost of the next share falls as your order grows.

Some numbers, for a stock with 2% daily volatility, taking Y = 1:

\`\`\`
   you trade… (% of ADV)     √(Q/V)      price move    cost as % of ADV traded
   ──────────────────────────────────────────────────────────────────────────
        0.1%                  0.032         0.06%             tiny
        1%                    0.100         0.20%             noticeable
        10%                   0.316         0.63%             expensive
        50%                   0.707         1.41%             you are the market
       100%                   1.000         2.00%             a full day’s σ
\`\`\`

The concavity is the whole story. Going from 1% to 10% of volume — **ten times the size** — only triples the price move. That is very good news if you are large, and it is the reason large funds exist at all.

## But the cost scales as Q^1.5

Here is the trap, and it catches people who have just learned the square-root law and drawn the wrong conclusion from its concavity.

You pay the impact **on every share you trade**, so:

\`\`\`
   cost  ≈  ΔP × Q  ∝  √Q × Q  =  Q^1.5
\`\`\`

Ten times the size is only three times the *price move*, but **thirty times the total cost**. Impact per share is concave; the bill is convex. Two things follow immediately:

**Every strategy has a capacity.** Your expected alpha scales like Q — twice the position, twice the profit. Your cost scales like Q^1.5. There is therefore a size at which the two cross and the strategy stops making money, no matter how good the signal. This is not a failure of execution; it is arithmetic, and it is why a strategy that prints money on £10m can be worthless at £1bn.

**Slicing is worth real money.** If impact depends on your participation rate rather than your absolute size, then splitting a parent order into child orders spread over time — and letting fresh liquidity and fresh noise traders arrive between them — genuinely reduces the bill. That is what the entire execution-algorithm industry sells: VWAP, TWAP, implementation-shortfall and participation-rate algos are all variations on *how slowly dare I go*.

And there’s the trade-off that makes execution a real problem rather than a solved one: **trade fast and pay impact; trade slow and bear risk** that the price moves for unrelated reasons before you’re done. The optimal schedule balances the two — that’s the Almgren–Chriss framework, and it is the direct commercial descendant of everything in M1.

## Why the square root? (honestly: unsettled)

There is no consensus derivation. Three serious families of explanation:

- **Latent liquidity.** The visible book is a tiny fraction of real trading intent; most liquidity is latent, in the minds of traders who reveal it only as the price approaches. Under plausible assumptions about how that latent density is shaped near the current price, √ falls out.
- **Fair pricing / no-arbitrage in impact.** If impact were linear, a trader could in some setups profitably round-trip against their own footprint; requiring that this be impossible pins the exponent near ½.
- **Propagator models.** Model impact as a decaying kernel applied to each child order. Order flow is famously long-memory (it autocorrelates for hours), and the decay must exactly offset that persistence or prices would be predictable — which forces a concave aggregate.

They are not mutually exclusive and none is airtight. Be comfortable saying the law is an extremely robust empirical regularity with contested foundations — that is the honest state of the field, and pretending otherwise is a tell.

## Reconciling with Kyle

Kyle isn’t refuted so much as **local**. Its linear λ describes a single auction with a fixed information set and Gaussian noise; the square-root law describes a parent order worked over hours against a market whose liquidity replenishes and whose participants adapt. Kyle is the right object for “what does one unit of surprise flow do right now”; the square-root law is the right object for “what will this £50m cost me by close.”

Both survive because they answer different questions. Reaching for the wrong one is the actual error.

> **Pub test:** Impact splits into **permanent** (the market learned something — Glosten–Milgrom) and **temporary** (you consumed liquidity and makers are skewed — Ho–Stoll), and only the permanent part stays after you stop. Empirically impact is **not** Kyle-linear but follows the **square-root law**, ΔP ≈ Y·σ·√(Q/V) with Y of order ½ to 1 — trade 1% of a day’s volume in a 2%-vol name and you move it about 0.2%. Because cost is impact **times** size, total cost scales like **Q^1.5**, which is why parent orders are sliced, why trading slowly is worth real money, and why every strategy has a **capacity** beyond which its alpha is eaten by its own footprint.
`},

# Latency & the HFT layer

This is the lesson most likely to be distorted by things you’ve already read, so it’s worth being precise. Speed is not a general-purpose advantage. It buys **two specific things**, and outside those two it buys nothing at all.

## What speed actually buys

**1. Queue position.** M0.2’s price-time priority means that at a given price level, orders fill in arrival order. If 40,000 shares rest at 50.00 and you are behind 30,000 of them, you fill only if the level trades more than 30,000 before it is cancelled or the price moves away.

\`\`\`
   the bid at 50.00, in arrival order

   ┌────────┬────────┬─────────┬─────────┬──────────────┐
   │ 12,000 │ 8,000  │ 10,000  │  YOU    │  later ...   │
   └────────┴────────┴─────────┴─────────┴──────────────┘
     ◀── fills first                       fills last ──▶
     30,000 shares ahead of you

   a 25,000-share market sell arrives  →  you get NOTHING
   a 45,000-share market sell arrives  →  you get 15,000
\`\`\`

Being a microsecond earlier moves you up the queue, and queue position is close to binary in its consequences. This is why the top of the book is not a “price” so much as a **race result**.

**2. Picking off stale quotes.** A maker’s quote reflects its estimate of value. When something that determines that value moves — the futures contract, an ETF’s underlying basket, the same stock on another venue — the quote is briefly *wrong*, and stays wrong until the maker can cancel it.

\`\`\`
   t = 0 μs    ES futures tick up. SPY is now worth more.
   t = ?       fast TAKER hits every stale SPY offer still resting
   t = ?       slower MAKER cancels — too late

   whoever’s message arrives first, wins. Same information,
   available to both. The entire contest is transmission time.
\`\`\`

Look carefully at what that is: **adverse selection where the private information is nothing but speed**. The maker loses exactly as it loses to a fundamental informed trader in M1.2 — it sold just before the price rose. Glosten–Milgrom’s μ, at microsecond resolution, is partly just *how many people are faster than me*.

This is why the arms race is symmetric and why it doesn’t end. Makers invest in speed **defensively**, to cancel before being picked off; takers invest **offensively**, to arrive before the cancel. Both are buying the same microseconds from the same suppliers.

## The physical layer

The constraints are embarrassingly concrete for a financial market.

\`\`\`
   Chicago ⇄ New Jersey, ~1,200 km each way

   light in vacuum          299,792 km/s   →  8.0 ms round trip
   light in optical fibre   ~200,000 km/s  →  12.0 ms  (glass is slow,
                                                and routes aren’t straight)
   Spread Networks fibre (2010)            →  ~13 ms — a $300m tunnel
                                                through the Alleghenies
   microwave through air (2012→)           →  ~8.5 ms — air beats glass,
                                                weather permitting
\`\`\`

Microwave beat a $300m fibre build within about two years, largely because the refractive index of air is closer to 1 than glass. Latency is now measured in **nanoseconds** inside a matching engine’s colocation hall, where the binding constraint can be the length of your cross-connect cable — which is why exchanges sell every customer the *same* cable length regardless of rack position.

## Where speed does not matter

This is the part usually omitted, and it matters more to most readers than everything above.

**If your holding period is longer than seconds, latency is not your cost.** A fund buying £50m of a stock to hold for six months is not losing to microseconds. It is paying **spread** (M0.4) and **impact** (M1.5) — costs measured in tens of basis points, orders of magnitude larger than anything latency does to it. Optimising the wrong one is a common and expensive mistake.

**Retail is not the victim of latency.** Retail orders are mostly internalised by wholesalers (M0.3) at or inside the NBBO, and never touch the race. The genuine questions about retail execution are about PFOF, segmentation and price improvement — not speed.

**The measured spread has fallen.** Whatever else HFT did, spreads and explicit costs are dramatically lower than in the quarter-fraction era. The serious critique isn’t “spreads got worse”; it’s about *who* captures the remaining spread, and whether the resources burned racing for it are socially wasted.

## The mechanism-design critique

The sharpest academic argument (Budish, Cramton & Shim, 2015) isn’t that fast traders are villains. It’s that **the continuous limit order book is a badly designed mechanism**: by processing messages in continuous time and serially, it turns every public information event into a race, and races are won by speed rather than by price. The rents are then competed into infrastructure spending rather than into tighter spreads.

Their proposed fix is elegant: **frequent batch auctions**. Discretise time into (say) 100ms intervals and clear all orders in each interval at a single uniform price. Arriving 5 μs earlier within a batch is worth exactly nothing, so the race collapses and competition returns to price. Related, live experiments: **IEX’s 350 μs speed bump** (a physical coil of fibre) and various asymmetric delays that slow takers but not maker cancellations.

None of this is settled policy, and batching has real costs of its own. But it reframes the debate usefully — from “are HFT firms good or bad people” to “what behaviour is this mechanism paying for?”

## And Flash Boys

Read it, but read it **after** the above, which is the roadmap’s advice and worth following. It is a genuinely good piece of narrative journalism, and it is also a book with protagonists — the IEX founders — whose venue it is effectively arguing for. Held up against the material in this module, you can see clearly which parts are accurate (the races are real, the stale-quote picking is real, the infrastructure spending is real) and which are overdrawn (that this constitutes systematic theft from ordinary investors, whose actual costs are spread and impact).

Being able to make that separation is roughly what M1 was for.

> **Pub test:** Speed buys two specific things and nothing else — **queue position** under price-time priority (M0.2), and the race to **pick off stale quotes** when a correlated price moves before the maker can cancel. The second is just adverse selection where the private information is *being fast*, which is why makers spend to defend as hard as takers spend to attack, and why Budish–Cramton–Shim call continuous trading a mechanism that manufactures an **arms race**. Where speed does **not** matter is anything held longer than seconds — a fund holding for a day pays **spread and impact** (M1.5), not latency, so most retail-facing “HFT is robbing you” claims point at the wrong cost.
`},

# Flow toxicity & maker-taker economics

M1 has been building one thing without stating it. Here it is, and every term is a lesson you have already done:

\`\`\`
   MAKER’S EDGE PER UNIT TRADED

     +  spread captured        earn the half-spread            M0.4
     +  rebate                 exchange pays you to post       this lesson
     −  adverse selection      you traded with the informed    M1.2
     −  inventory cost         you’re holding risk (γqσ²τ)     M1.3
     −  fees & tech            colocation, feeds, clearing     M0.6 / M1.6
   ────────────────────────────────────────────────────────────────────
     =  what a market-making business actually optimises
\`\`\`

Read that as a job description and the industry stops being mysterious. Nobody at these firms is trying to be fast, or to be tight, or to have volume. They are trying to make that expression positive, at scale, and every apparent quirk of their behaviour is one of those terms being managed.

## Toxicity: adverse selection you can measure

**Toxic flow** is order flow that systematically loses money for the maker who fills it — the adverse-selection term, made operational. It’s the practitioner’s word for μ in Glosten–Milgrom.

The maker cannot see μ. But it can see something suggestive: **order-flow imbalance**. Informed flow is directional by construction; noise flow is roughly balanced. So sustained one-sidedness is evidence of information.

**VPIN** (volume-synchronised probability of informed trading) formalises that. Rather than clock time, bucket the tape into equal-**volume** buckets — so busy periods generate more observations, which is the point:

\`\`\`
   for each bucket of V shares, classify volume as buy- or sell-initiated:

                  Σ over buckets  | V_buy − V_sell |
        VPIN  =  ───────────────────────────────────
                        n · V

   balanced flow  (V_buy ≈ V_sell)  →  VPIN → 0   → benign
   one-sided flow (all one way)     →  VPIN → 1   → toxic
\`\`\`

Used live, a rising VPIN says *widen, or stop quoting*. Easley, López de Prado and O’Hara showed it climbing sharply before the **May 2010 Flash Crash**, and argued it works as an early-warning signal for liquidity withdrawal.

**It is contested, and you should know that.** Andersen and Bondarenko argued the result is largely an artefact — that VPIN is substantially a repackaging of volatility and volume, that its bulk volume classification is noisy, and that its predictive claims don’t survive careful testing. The honest position: the *concept* of toxicity is indispensable and every real maker estimates something like it; **VPIN specifically** is one contested estimator, not a settled measurement. Say that in an interview and you’ll sound like someone who read past the abstract.

## Maker-taker: exchanges paying for liquidity

Venues compete for order flow, and liquidity is self-reinforcing — a book with depth attracts more depth. So exchanges pay for it.

\`\`\`
   MAKER-TAKER  (the common model)
     post a resting order that gets filled  →  you RECEIVE a rebate
     take liquidity with a marketable order →  you PAY a fee
     typical US equities: −0.20 ¢ / +0.30 ¢ per 100 shares
     the exchange keeps the difference

   TAKER-MAKER / “inverted”  (some venues)
     exactly reversed — pays takers, charges makers.
     Exists to attract takers to a thin book, and because some
     flow is worth paying for (see segmentation, below).
\`\`\`

Two consequences that matter more than the arithmetic:

**The economically real spread is net of rebates.** A quoted spread of one cent, with a rebate of 0.2 cents per side, is not a one-cent spread to the participants. It can be rational to post at a price that looks like it loses money on the spread alone, because the rebate makes it profitable — which is precisely how markets stay quoted at the minimum tick.

**Routing incentives and client interests come apart.** The rebate accrues to whoever posts the order — the **broker** — while best execution is owed to the **client**. A broker choosing between venues offering identical prices but different rebates has an interest that is not the client’s. This is a live regulatory question, it is why Reg NMS’s protection of *displayed prices* doesn’t settle the matter, and it is the sharpest structural criticism of maker-taker.

## Segmentation: the punchline of M0 and M1 together

Now put PFOF (M0.3), adverse selection (M1.2) and toxicity together, because the combination explains the shape of the modern US equity market.

\`\`\`
   ALL ORDER FLOW
        │
        ├──▶ RETAIL ──▶ wholesaler / internaliser
        │              low μ, predictable, benign
        │              → filled off-exchange, INSIDE the quoted spread
        │              → wholesaler pays the broker for it (PFOF)
        │
        └──▶ EVERYTHING ELSE ──▶ the lit book
                       institutions, funds, other makers
                       → higher average μ  →  MORE TOXIC
                       → lit spreads must be WIDER to survive it
\`\`\`

Wholesalers aren’t being generous when they price-improve retail orders. They are paying for the *right kind* of counterparty — and every benign order they remove raises the average toxicity of what’s left on the lit book, which must widen accordingly.

That gives you the genuinely hard policy question, which has no clean answer: retail investors demonstrably get **better** prices than the displayed quote, while the displayed quote itself is **worse** than it would be if their flow were in it. Whether that is good depends on who you weigh, and anyone confident in either direction is skipping a step.

## What this module was for

You can now read a real market as a system of forces rather than a set of terms:

- A **spread** is order-processing plus inventory plus adverse selection (M0.4), and you can derive the last two (M1.2, M1.3).
- A **price move** is permanent or temporary, and which one it is tells you whether it was information or inventory (M1.5).
- **Depth** is not resting size — it is how hard it is to distinguish information from noise (M1.4).
- **Speed** buys queue position and stale quotes, and nothing else (M1.6).
- A **market-making business** is the equation at the top of this page (M1.7).

M2 changes the subject to pricing and strategy, and M5 returns to these same firms to ask how they’re actually organised and paid. But the layer in this module is the one most of them live in.

> **Pub test:** A maker’s edge is one equation — **spread captured + rebate − adverse selection − inventory cost − fees**, and every term is a lesson in this module. **Toxicity** is the adverse-selection term measured on live flow; **VPIN** estimates it from order-flow imbalance in volume buckets, and is genuinely contested. **Maker-taker** pricing pays the maker a rebate and charges the taker, so the economically relevant spread is the quoted spread *net of rebates* — and because the rebate accrues to the **broker** while best execution is owed to the client, routing incentives and client interests come apart. **Segmentation** is the punchline — wholesalers cream off uninformed retail, so what reaches the lit book is more toxic than average, and lit spreads must be wider to survive it.
`},

# The quant pipeline

M0 and M1 were about how markets work. M2 is about trying to make money in one, and it opens with the least glamorous and most important observation in the field:

> **A quant strategy is a pipeline, not a formula.**

Newcomers picture the whole enterprise as *finding the signal* — the equation that predicts returns. In practice the signal is one of four stages, it is rarely the hardest, and a good signal wired into bad execution is simply a losing business with extra steps.

\`\`\`
   ┌──────────┐   ┌──────────┐   ┌───────────┐   ┌──────────┐
   │  SIGNAL  │──▶│  SIZING  │──▶│ EXECUTION │──▶│   RISK   │
   └──────────┘   └──────────┘   └───────────┘   └──────────┘
    what do you    how much do     how do you      what kills
    believe?       you bet?        get filled?     you?

    fails by:      fails by:       fails by:       fails by:
    overfitting    over-betting    impact & fees   correlation
    (M2.7)         a real edge     (M1.5)          you didn’t
                   into ruin                       model
\`\`\`

Each stage has its own literature and its own way of destroying you, and they are not interchangeable — an improvement in execution cannot rescue a signal that was never there, and a genuine signal can be entirely consumed by the costs of harvesting it. M2.6 runs one strategy through all four; M2.7 explains why the backtest of it lied.

## Alpha and beta

The first question asked of any return stream is *where did this come from?* The standard decomposition:

\`\`\`
   r_p  =  α  +  β·r_m  +  ε

     β·r_m   the part explained by exposure to a known factor
     α       the part that isn’t
     ε       noise
\`\`\`

**Beta is cheap.** Exposure to the market is available in an index fund for a few basis points a year. So if your strategy’s returns are mostly market exposure in a costume, you are charging for something the client can buy at Vanguard.

**Alpha is what survives the explanation.** And the uncomfortable historical pattern is that alpha keeps turning into beta: value, size, momentum, carry, quality, low-volatility, and now trend — each was someone’s alpha until it was identified, named, and packaged into an ETF. *Factor* is just the industry’s word for “alpha we have caught and domesticated.”

The practical form of the question is therefore: **against what benchmark, and controlling for which known factors, is this return actually unexplained?** A strategy that hasn’t been regressed against the obvious factors hasn’t been evaluated.

## The Sharpe ratio, and why its estimate lies

The standard scorecard is return per unit of risk:

\`\`\`
   S  =  (mean excess return) / (standard deviation of return)

   annualised from daily data:   S_annual  =  S_daily × √252
\`\`\`

Rough calibration, so the numbers mean something:

\`\`\`
   Sharpe    what it is
   ────────────────────────────────────────────────────────────
   ~0.4      the equity market, long-run. Buy-and-hold.
   ~1        a good systematic strategy. Genuinely hard.
   ~2        excellent. A real business.
   3+        either a high-turnover market-making operation
             (thousands of near-independent bets a day), or —
             far more often — a bug, a lookahead, or a backtest
   ────────────────────────────────────────────────────────────
\`\`\`

Now the part that changes how you read every performance claim you will ever see. **The Sharpe ratio is an estimate, and it is a noisy one.** For roughly independent returns, its standard error is

\`\`\`
   SE(Ŝ)  ≈  √( (1 + S²/2) / n )   per period

   ⟹  annualised, for n daily observations:   SE  ≈  √(252 / n)
\`\`\`

Put actual numbers on that:

\`\`\`
   data          n       SE of the annualised Sharpe estimate
   ────────────────────────────────────────────────────────────
   1 year       252              1.00      ◀ useless
   2 years      504              0.71
   4 years    1,008              0.50
   10 years   2,520              0.32
\`\`\`

**One year of daily data gives a standard error of about 1.0.** A strategy that backtests at Sharpe 1.0 over a year is, statistically, indistinguishable from a strategy with no edge whatsoever. Two years is not much better. You need something like **four years** before you can separate Sharpe 1 from zero at two standard errors — and that assumes the returns are independent and the world stayed still, neither of which is true.

This single fact does more damage to more strategies than any other in quantitative finance. Hold on to it, because M2.7 makes it worse: those figures are for testing **one** strategy chosen in advance. Search over hundreds, keep the best, and the best will look wonderful by construction.

## The culture, which is the real content

The roadmap is blunt that for a quantitative reader the mathematics here is mostly straightforward and the value is the **vocabulary and the culture**. That is right, and worth saying plainly:

The hard part of this field is not deriving Black–Scholes. It is the discipline to hold out data you are desperate to look at, to size a position smaller than your conviction, to regress your beautiful signal against boring factors and watch it evaporate, and to subtract costs you would rather assume away. The maths is undergraduate. The temperament is not.

> **Pub test:** A quant strategy is a **pipeline**, not a formula — signal, sizing, execution, risk — and money leaks at every stage, so a good signal with bad execution is a losing business. Returns split into **beta** (exposure to known factors, rentable for a few basis points) and **alpha** (whatever survives), and most claimed alpha is unrecognised beta. Performance is measured by the **Sharpe ratio**, whose estimate is far noisier than people assume — the standard error is about **√(252/n)** for n daily observations, so one year of data gives SE ≈ 1.0 and cannot distinguish a Sharpe-1 strategy from pure noise. You need roughly four years to do it at two standard errors.
`},

# Black–Scholes as replication

M0.8 asserted that a three-month at-the-money call on a £100 stock costs about £5, and openly deferred the question of where that number comes from. Here it is — and the honest route to it does not start with the famous formula. It starts with a much better idea.

## First, the intuition that fails

The natural guess is that an option should be worth its **expected payoff, discounted**. Take the M0.8 setup, simplified to one period and zero interest, and let the stock go to either 110 or 90:

\`\`\`
   S = 100.  In three months it is 110 or 90.
   Call, strike 100:   pays 10 if up,  0 if down.

   if the stock rises with probability p …

      p = 0.5   →  E[payoff] = 5
      p = 0.9   →  E[payoff] = 9      ← a bullish stock, dearer option?
      p = 0.1   →  E[payoff] = 1
\`\`\`

Reasonable, and wrong. **The price is £5 in all three cases.** A stock everyone is certain will rise does not carry a more expensive call, and understanding why is the whole lesson.

## The idea that works: build the thing

Forget forecasting. Ask a construction question instead:

> Can I build a portfolio out of the **stock** and **cash** that pays *exactly* what the option pays, in *every* state of the world?

If I can, then that portfolio and the option are the same object with different names, and no-arbitrage says they must cost the same. Otherwise buy the cheap one, sell the dear one, and collect the difference with no risk.

Let the portfolio hold **Δ** shares and **B** in cash, and demand it match the option in both states:

\`\`\`
   up state:    Δ·110  +  B  =  10
   down state:  Δ· 90  +  B  =   0        (r = 0, so cash doesn’t grow)
   ───────────────────────────────────────────────────────────────
   subtract:    Δ·(110 − 90)  =  10 − 0

                        f_up − f_down          10 − 0
                Δ  =  ─────────────────  =  ───────────  =  0.5
                        S_up  − S_down        110 − 90

   back-substitute:   0.5·90 + B = 0   ⟹   B = −45
\`\`\`

So: **hold half a share, borrow £45.** That portfolio pays 10 if the stock rises and 0 if it falls — precisely the option. Its cost today is

\`\`\`
   price  =  Δ·S + B  =  0.5 × 100 − 45  =  £5
\`\`\`

There is M0.8’s £5, and it isn’t a plausible-sounding number any more. It is the cost of manufacturing the option out of parts.

Notice what **Δ = 0.5** is: the number of shares you must hold to track the option. It is the **hedge ratio** — and it is the same delta that becomes the first of the greeks in M2.3. Delta was never fundamentally a sensitivity or a probability; it is *how much stock the replication requires*.

## Where the probability went

Now rearrange the same answer to expose what happened. Define

\`\`\`
        S − S_down        100 − 90
   q = ──────────────  =  ─────────  =  0.5
       S_up − S_down      110 − 90

   price  =  q·f_up + (1−q)·f_down  =  0.5 × 10 + 0.5 × 0  =  £5   ✓
\`\`\`

The price *looks* like a discounted expected payoff again — but under **q**, not under the real probability **p**. And p appears nowhere. It cancelled, exactly, and not by luck.

**Why it must cancel:** the replicating portfolio matches the option in *every* state. A hedged position has no exposure to which state occurs, so how likely each state is cannot enter its cost. What you are paying for is not a bet on direction — it is the **cost of running the hedge**, and that depends on how far apart the states are, not on their probabilities.

This is the single most counter-intuitive true thing in derivatives pricing, and it is worth being able to say in one sentence: *the option price doesn’t depend on where you think the stock is going, because the seller doesn’t have to guess — they can hedge.*

## The risk-neutral measure, demystified

q is called the **risk-neutral probability**, which is an unhelpful name that has confused generations. Three clarifications:

- **It is not a belief.** Nobody thinks the stock rises with probability q. It is the weight that makes the arithmetic of replication come out right.
- **It is a change of measure.** Under q, the discounted price of every tradeable asset is a **martingale** — its expected future value equals its value now. Pricing by "expectation under q" is a computational device that packages the replication argument, nothing more.
- **It is why the name says risk-neutral.** In a world where investors genuinely didn't care about risk, prices *would* be discounted expected payoffs. Replication lets us borrow that world's easy arithmetic without believing we live in it.

The deep version of this is the Fundamental Theorem of Asset Pricing: **no arbitrage ⟺ a risk-neutral measure exists**, and **completeness** (every payoff replicable) ⟺ it is unique. That equivalence is what M2 is quietly built on.

## From two states to Black–Scholes

The rest is limits, not new ideas. Chain the one-period tree into many periods, rebalancing Δ at each node; let the steps shrink and the number of them grow. The binomial price converges, and its limit is the Black–Scholes formula:

\`\`\`
   C  =  S·N(d₁)  −  K·e^(−rT)·N(d₂)

              ln(S/K) + (r + σ²/2)T
        d₁ = ─────────────────────── ,    d₂ = d₁ − σ√T
                     σ√T
\`\`\`

Two readings worth carrying:

- **N(d₂)** is the risk-neutral probability the option finishes in the money — the q of the two-state model, grown up.
- **N(d₁)** is **delta**, the hedge ratio. The formula's structure is exactly the binomial one — *hold N(d₁) shares, borrow the discounted strike times N(d₂)* — which is to say the whole thing is still "cost of the replicating portfolio."

Now look at the inputs:

\`\`\`
   S   spot ......................... observable
   K   strike ....................... in the contract
   T   time to expiry ............... a calendar
   r   interest rate ................ observable
   σ   volatility ................... ✗ NOT OBSERVABLE
\`\`\`

**Exactly one input is unknown**, and it is the one describing the future. That asymmetry is the reason options markets talk in volatility rather than price, and it is the entire subject of M2.4.

## Which assumptions actually bite

Black–Scholes assumes continuous costless trading, a constant known σ, and lognormal prices. All false. But they fail with very different severity, and knowing which is which is the difference between using the model and believing it:

\`\`\`
   assumption            reality                          how bad
   ──────────────────────────────────────────────────────────────────
   no transaction costs  spread + impact (M0.4, M1.5)     bad — continuous
                                                          rehedging is
                                                          infinitely
                                                          expensive
   constant σ            volatility clusters and moves    bad — this is
                                                          what the smile
                                                          is telling you
                                                          (M2.4)
   lognormal returns     fat tails, jumps, crashes        WORST — the
                                                          Gaussian core
                                                          understates
                                                          extremes (M3)
   continuous trading    discrete, and gappy overnight    moderate
\`\`\`

Which is why the standard line — that Black–Scholes is *the wrong model that everyone uses correctly* — is not a joke but a description of practice. What it is used for is not predicting the price. It is used as an invertible, universally agreed **translation between price and volatility**. M2.4 is about what people say once they have that language.

> **Pub test:** An option is priced by **replication**, not forecasting. Build a portfolio of Δ shares plus cash that pays exactly what the option pays in every state, and no-arbitrage forces the option to cost what that portfolio costs — so pricing is a construction problem. Solve the one-period binomial and Δ falls out as the **hedge ratio**, while the **real probability of the stock rising vanishes from the answer**, because hedging removes directional exposure and leaves only the cost of running the hedge. What replaces it is the **risk-neutral measure** q — a computational device that makes discounted prices martingales, not anybody’s belief. Black–Scholes is the continuous limit, and every input is observable **except σ**, which is the whole subject of M2.4.
`},

# The greeks, operationally

The greeks are partial derivatives of the option price. That description is accurate and tells you nothing about why anyone computes them. Each one exists because it answers a question somebody has to answer before the end of the day.

\`\`\`
   greek   derivative     the operational question
   ─────────────────────────────────────────────────────────────────────
   Δ delta   ∂V/∂S        how many shares do I hold to be hedged?
   Γ gamma   ∂²V/∂S²      how fast does that hedge go stale?
   Θ theta   ∂V/∂t        what does holding this cost me per day?
   ν vega    ∂V/∂σ        what happens if the market repriced volatility?
   ρ rho     ∂V/∂r        (usually nothing. Long-dated options only.)
\`\`\`

Only vega is not a Greek letter, which tells you something about who named these.

## Delta — the hedge ratio you already derived

M2.2 built delta from scratch: it is the number of shares in the replicating portfolio, \`N(d₁)\` in Black–Scholes. Calls run from 0 (deep out) to 1 (deep in); puts from −1 to 0; at the money it sits near ±0.5.

One correction worth internalising, because the sloppy version is everywhere: **delta is not the probability of finishing in the money.** That is \`N(d₂)\`. They are close for short-dated near-the-money options and diverge as maturity and moneyness grow. Using delta as a probability is a decent field approximation and a bad thing to say to someone who prices options.

## Gamma — the curvature that makes options interesting

Gamma is the rate at which delta changes as the stock moves. A hedge set this morning is wrong by this afternoon, and gamma says how wrong.

\`\`\`
   long gamma                        short gamma
   ──────────────────────────────────────────────────────────────
   stock rises → delta rises →       stock rises → delta falls →
   you must SELL to re-hedge         you must BUY to re-hedge
   stock falls → delta falls →       stock falls → delta rises →
   you must BUY to re-hedge          you must SELL to re-hedge
   ──────────────────────────────────────────────────────────────
   rehedging buys low, sells high    rehedging buys high, sells low
   every move pays you a little      every move costs you a little
\`\`\`

That table is the entire economics of the thing. **Long gamma means your own hedging mechanically buys low and sells high.** Nothing about the stock's direction is required — only that it *moves*. Short gamma is the mirror: you are forced to chase, and a violently moving market bleeds you.

Gamma is largest for at-the-money options near expiry, which is exactly when delta is most unstable — a stock hovering at the strike on expiry day has a delta lurching between 0 and 1.

## Theta — the rent

Nothing that good is free. Long gamma is **always** short theta: the option decays, every day, and the decay is what you pay for the privilege of being long curvature. The relationship is not a tendency, it is an identity in the Black–Scholes world, which the next section makes exact.

M0.8 called an option a wasting asset. Theta is the waste, and gamma is what you bought with it.

## The result that ties them together

Take a long option, delta-hedged, and Taylor-expand its value over a short interval:

\`\`\`
   dV  =  Δ·dS  +  ½Γ·(dS)²  +  Θ·dt   +  …

   you are delta-hedged, so the Δ·dS term is cancelled by the hedge:

   hedged P&L  =  ½Γ·(dS)²  +  Θ·dt
\`\`\`

Now substitute Black–Scholes theta. With r = 0,

\`\`\`
   Θ  =  −½ Γ S² σᵢ²        (σᵢ = the IMPLIED vol you paid)

   hedged P&L  =  ½Γ·(dS)²  −  ½ Γ S² σᵢ² dt
               =  ½Γ [ (dS)²  −  S² σᵢ² dt ]

   and over a short step the stock actually delivers  E[(dS)²] = S²σ_r² dt
   ──────────────────────────────────────────────────────────────────────
        hedged P&L  ≈  ½ Γ S² ( σ_realized²  −  σ_implied² ) · dt
\`\`\`

Read what has happened. **The direction of the stock has vanished.** What remains compares the volatility the stock *actually delivered* against the volatility you *paid for*. Gamma is the exchange rate between them.

Which gives the sentence this lesson exists for:

> **A delta-hedged option is not a bet on the stock. It is a bet that realized volatility will exceed implied volatility.**

## Checking it actually works

Worth verifying rather than believing. Buy a 3-month at-the-money call on a £100 stock at **20% implied**, delta-hedge it daily to expiry, and let the stock genuinely realize various volatilities:

\`\`\`
   at S = K = 100, T = 0.25, σᵢ = 20%:
      price = £3.99      delta = 0.520      gamma = 0.0398
      ½ΓS² = 199.2   ← the exchange rate between vol² and money

   realized vol    simulated hedged P&L    ½ΓS²(σr²−σi²)T
   ────────────────────────────────────────────────────────
       15%               −1.00                 −0.87
       20%               +0.00                  0.00     ◀ breaks even
       25%               +0.99                 +1.12
       30%               +1.98                 +2.49
\`\`\`

The middle row is the point: when realized equals implied, the hedged position earns **nothing** — the gamma you harvest exactly pays the theta you owe. You bought volatility at 20% and it delivered 20%, so you broke even, which is what a fairly priced asset should do.

Note also that the closed form drifts high at 30%. That is honest and instructive: \`½ΓS²\` uses *today's* gamma, but gamma changes as the stock moves away from the strike and as time runs out. The formula is a local statement, excellent for a day and rough over a quarter.

## Vega — the exposure that actually gets traded

Since the whole position is a view on volatility, the sensitivity to volatility is the one desks manage most closely. **Vega** is ∂V/∂σ — what you make if the market simply *reprices* volatility, with the stock unmoved.

Distinguish the two ways a vol view pays, because they are different trades:

- **Gamma** pays off when volatility is *realized* — the stock actually moves, and you harvest it by rehedging.
- **Vega** pays off when volatility is *repriced* — the market's implied vol rises and your option is marked up, whether or not the stock ever moves.

Vega is largest for long-dated options (more time for vol to matter); gamma is largest for short-dated ones. So "long vol" is ambiguous until you say which — and a desk long gamma and short vega has a coherent, common, and quite specific view.

All of which leaves one question: implied volatility is the price, so what does the market actually charge, and why isn't it one number? That is M2.4.

> **Pub test:** The greeks are partial derivatives, but each answers an operational question — **delta** is the hedge ratio, **gamma** is how fast that hedge goes stale, **theta** is what you pay per day, **vega** is exposure to volatility itself. The relation that matters is that Taylor-expanding a delta-hedged option and substituting Black–Scholes theta (Θ = −½ΓS²σᵢ² when r = 0) leaves **P&L ≈ ½ΓS²(σ_realized² − σ_implied²)·dt** — the direction of the stock has cancelled. So **long gamma is always short theta**, and a delta-hedged option is a pure bet that realized volatility beats implied, breaking exactly even when they match. You do not trade options; you trade volatility.
`},

# Implied volatility & the surface

M2.2 ended on an asymmetry. Of the five Black–Scholes inputs, four are observable — spot, strike, expiry, rate — and one, **σ**, describes the future and cannot be looked up anywhere.

The market's response to this is the most pragmatic move in all of finance: **stop trying to supply σ, and start solving for it instead.**

## Running the formula backwards

Options trade at prices set by supply and demand, not by anybody's model. Take an observed price and ask the inverse question:

\`\`\`
   forward  (what the textbook does):
        S, K, T, r,  σ = 20%    ──▶  Black–Scholes  ──▶  price = £3.99

   backward (what the market does):
        S, K, T, r,  price = £4.50  ──▶  solve  ──▶  σ = 22.6%
                                                      ▲
                                          IMPLIED VOLATILITY
\`\`\`

Implied volatility is *the number you must feed Black–Scholes to reproduce the price the market is actually charging.* Nothing more. Because the price is strictly increasing in σ, the inversion is unique and well behaved, and any root-finder does it in microseconds.

This reframes what the model is for. **Black–Scholes is not being used to predict prices — it is being used as a translation layer.** It converts a price, which depends on strike, spot, expiry and rates in ways that make two options hard to compare, into a single number that is roughly comparable across contracts. That is why traders quote in vol, negotiate in vol, and think in vol.

> The famous line — *the wrong model everyone uses correctly* — means precisely this. Nobody needs the model's assumptions to be true. They need everyone to agree on the same invertible function, and Black–Scholes is the one everyone agreed on.

## The test the model fails

Here is the sharp consequence. Black–Scholes assumes σ is a property of **the stock** — one number, constant, describing how that asset moves. If that were true, then every option on the same underlying, at every strike and every expiry, would imply **the same σ**.

Plot the implied vols and they are not the same. They are not close.

\`\`\`
   implied vol by strike, one expiry, an equity index

     σᵢ
   30%│●
      │ ●                                    EQUITY SKEW
   25%│   ●                                  downside puts imply
      │     ●                                much higher vol than
   20%│        ●                             upside calls
      │            ●   ●
   15%│                    ●   ●   ●
      └────┬────┬────┬────┬────┬────┬────▶ strike
          80   90   100  110  120  130
                     ▲ spot
\`\`\`

For equity indices the pattern is a **skew** (or smirk): implied vol falls monotonically as strike rises. In FX it is closer to a symmetric **smile**, both wings above the middle. Add the maturity dimension — implied vol also varies with time to expiry, in a **term structure** — and the whole object is a two-dimensional **volatility surface** over strike and maturity, which moves every day.

The surface is not a curiosity or a market inefficiency. It has been there since 1987, in every liquid options market, and it has a clear meaning:

> **The surface is a map of Black–Scholes' errors.** Where the market pays more than the model says, it is pricing something the model left out.

## What the shape is telling you

Three omissions account for most of it.

**Fat tails.** Black–Scholes assumes lognormal prices, so a −20% day is essentially impossible. Reality disagrees — decisively, and this is the entire subject of M3. Out-of-the-money puts pay off precisely in those "impossible" states, so the market charges more for them than a Gaussian model thinks they are worth. Higher price, higher implied vol, and the wing lifts.

**Crash asymmetry, and why equities skew rather than smile.** Equity markets fall faster than they rise: volatility spikes in selloffs and subsides in rallies. Two standard explanations, both partly true — the *leverage effect* (a falling equity price raises a firm's debt-to-equity ratio, making the remaining equity genuinely riskier) and plain *demand* (portfolio insurance is bought by people who own stock and fear a crash, so downside protection is structurally bid). Either way the risk is one-sided, and so is the curve. The skew's steepening after the 1987 crash is one of the cleanest natural experiments in finance — before it, the surface was much flatter.

**Volatility is itself random.** Black–Scholes takes σ as constant. Actual volatility clusters, mean-reverts, and jumps. An option is convex in σ, so uncertainty *about* volatility raises value — most at the wings, which is smile-shaped.

The serious models exist to fit exactly these: **local volatility** (Dupire — make σ a deterministic function of spot and time, fitting today's surface exactly), **stochastic volatility** (Heston, SABR — give σ its own random process, which produces smiles naturally), and **jump-diffusion** (Merton — add discrete jumps, which produce fat tails directly). All are in a real sense repairs to the assumption list at the end of M2.2.

## Vol as the tradeable object

Once implied vol is the price, it becomes something to have a view on — and M2.3 already gave you the machinery. Buy an option, delta-hedge it, and you are long realized vol and short implied vol:

\`\`\`
   your view                          the trade
   ────────────────────────────────────────────────────────────────
   "the market will move MORE than    buy options, delta-hedge
    22% implied"                       → long gamma, short theta
                                       → wins if realized > 22%

   "implied vol itself will RISE"     buy options, hold
                                       → long vega
                                       → wins on repricing, no
                                         movement required

   "the skew is too steep"            sell puts, buy calls, hedge
                                       → a view on the SHAPE, not
                                         the level
\`\`\`

That third row is where volatility trading stops being a bet on one number. Desks take positions on the level of the surface, its slope (skew), its curvature (smile), and its term structure — each a distinct exposure with its own drivers.

One empirical regularity worth knowing, because it explains a whole industry: **implied volatility usually exceeds subsequently realized volatility.** The variance risk premium is persistently positive, meaning option *sellers* earn on average. This is not free money — you are being paid to hold exactly the risk that hurts most when everything else does, which is why the strategy's return profile looks like short gamma, because it is. M0.8 warned about this shape; here is where it gets a price.

Everything above rests on the claim that returns are far from Gaussian. **M3 is where that claim gets tested properly** — and where the "impossible" days turn out to be routine.

> **Pub test:** σ is the one Black–Scholes input nobody can observe, so the market runs the formula **backwards** — take the traded price, solve for the σ that reproduces it, and call it **implied volatility**. That makes Black–Scholes a **quoting language** rather than a belief, an agreed bijection between price and vol. If the model were true, every strike and maturity on one underlying would imply the same σ. They don’t — equities show a **skew** (downside puts imply higher vol) and FX a **smile**, and the whole two-dimensional **surface** moves. The surface is the market pricing in exactly what the model omits — fat tails, jumps, and volatility that is itself random — so its shape is a **map of the model’s errors**.
`},

# Correlation vs cointegration

Pairs trading rests on one claim: two assets have wandered apart, and they will come back together. Everything hangs on whether that second half is true — and the statistic most people reach for to check it cannot answer the question at all.

## The trap, quantified

Take two random walks that are **completely independent**. No shared factor, no relationship of any kind — one is not informative about the other in any way. Simulate 500 steps, 2,000 times, and measure how correlated they look:

\`\`\`
   two INDEPENDENT random walks, 500 steps, 2,000 trials

                        median |corr|    P(|corr| > 0.5)   P(|corr| > 0.8)
   ───────────────────────────────────────────────────────────────────────
   correlation of
   LEVELS  (prices)         0.43              41%                7%
   correlation of
   RETURNS (changes)        0.03               0%                —
\`\`\`

Two unrelated series show a level-correlation above 0.5 more than **40% of the time**, and above 0.8 in one case in fourteen. Screen a few thousand pairs on price correlation and you will find hundreds of beautiful, utterly meaningless relationships.

This is the **spurious regression** problem (Granger & Newbold, 1974). It happens because correlation assumes stationary data, and prices are not stationary — they wander. Two independent wanderers will, by chance, often wander in vaguely similar directions over any finite window, and the correlation statistic dutifully reports that as a relationship.

Notice the second row is fine. **Returns** are roughly stationary, and their correlation behaves — 0.03, as it should for independent series. So the first rule is simply: *never compute a correlation on prices.* If you must use correlation, use it on returns.

But even that doesn't get you what a pairs trade needs.

## Two different claims

\`\`\`
   CORRELATION (of returns)          COINTEGRATION (of levels)
   ─────────────────────────────────────────────────────────────────────
   "they move together day to day"   "they cannot drift apart forever"
   short-run co-movement             long-run equilibrium
   memoryless — says nothing         has memory — says the GAP is
   about the accumulated gap         mean-reverting
   ─────────────────────────────────────────────────────────────────────
   supports:  hedging, risk models   supports:  mean-reversion trading
\`\`\`

The two are genuinely independent properties, and both off-diagonal cases are real:

**Highly correlated, not cointegrated.** Two tech stocks whose daily returns correlate at 0.9, but one compounds at 15% a year and the other at 5%. They move together *and* separate permanently. Trade the spread and you are short a trend — you will fade a divergence that never closes, adding to the loser all the way down. This is the classic way pairs traders are destroyed, and correlation gave no warning.

**Cointegrated, weakly correlated.** A stock and its own convertible bond, or a commodity and a producer of it. Daily returns can be noisy and only loosely related, while the *levels* are bound by an arbitrage or an economic identity that reliably reasserts itself.

**Only the second is tradeable as mean reversion.** Correlation is the wrong instrument, measured on the wrong quantity, answering a different question.

## Cointegration, stated properly

\`\`\`
   x and y are each I(1)        — non-stationary; their DIFFERENCES are
                                  stationary (i.e. random-walk-like prices)

   they COINTEGRATE if there exists β such that

            s  =  y − βx        is I(0)  — stationary

   β is the HEDGE RATIO, s is the SPREAD
\`\`\`

So cointegration says: the individual series wander without bound, but *this particular combination of them does not*. There is an equilibrium, and deviations from it are temporary. That is exactly the statement a mean-reversion trade needs, and it is a statement about levels, which is why correlation could never have supplied it.

Two standard tests:

- **Engle–Granger**, two steps: regress y on x by OLS to get β̂, then run an **ADF** (augmented Dickey–Fuller) test for a unit root on the residual. Reject the unit root → the spread is stationary → cointegrated. One trap: because β was *estimated*, the usual ADF critical values are wrong and too generous — use the Engle–Granger critical values instead. Skipping this is a common way to find cointegration that isn't there.
- **Johansen**, for three or more series at once, which also handles the case of several independent cointegrating relationships. Necessary for baskets; overkill for a pair.

## Half-life — the number that decides the trade

Knowing the spread reverts is not enough. You need to know **how fast**, because that determines everything downstream. Model the spread as Ornstein–Uhlenbeck:

\`\`\`
   ds  =  θ(μ − s)dt  +  σ dW           θ = speed of reversion

   estimate by regressing the CHANGE on the LEVEL:

        Δsₜ  =  a  +  b·sₜ₋₁ + ε        with   θ = −b

                             ln 2
        half-life  =  ────────────────
                            −b
\`\`\`

If b is not significantly negative, there is no reversion to trade — the regression itself is a cointegration check.

Half-life is the single most operationally useful number in the whole exercise:

\`\`\`
   half-life        what it implies
   ──────────────────────────────────────────────────────────────────
   minutes          you are in M1.6 territory. Latency and queue
                    position decide whether you exist. Costs are
                    paid hundreds of times a day.
   days to weeks    tractable. Hold for roughly a half-life or two;
                    costs are amortised over a meaningful move.
   many months      the statistics are hopeless — a 6-month half-life
                    gives you a handful of independent observations
                    per decade, so you cannot tell the edge from zero
                    (M2.1's standard error).
\`\`\`

It also sets your **cost budget**, which is the link back to M1. A spread with a two-week half-life is crossed a few times a month; one with a two-hour half-life is crossed hundreds of times, and pays spread and impact on every crossing. The same statistical edge is a business at one speed and a donation at the other.

## The risk nobody models

Cointegration is an **empirical regularity, not a law of nature.** The relationship exists because of something real — a shared input cost, a substitution effect, a corporate structure — and that something can change.

\`\`\`
   what breaks a cointegrating relationship
   ─────────────────────────────────────────────────────────
   a merger, spin-off, or capital restructuring
   a regulatory change hitting one side only
   a genuine divergence in business model or margins
   the trade becoming crowded, then unwinding at once
\`\`\`

The failure mode is cruel by construction. A structural break looks *identical* to an unusually good entry — the spread is further from its mean than it has ever been, so your z-score is screaming, so you size up. The signal is loudest exactly when it is wrong.

Which is why a pairs trade needs a risk rule that does not come from the signal: a stop on the spread, a maximum holding period of a few half-lives, and a periodic re-test of the cointegration itself on recent data. M2.6 puts all of that together.

> **Pub test:** Correlation is about **returns** moving together in the short run; cointegration is about **levels** staying tethered in the long run, and only the second justifies a mean-reversion trade. Correlation computed on the *levels* of non-stationary series is close to meaningless — two completely **independent** random walks have a median absolute level-correlation of 0.43, exceeding 0.5 about 41% of the time, while their return correlation sits at 0.03. That is the **spurious regression** trap. Formally, two I(1) series cointegrate if some combination y − βx is stationary, tested by **Engle–Granger** or **Johansen**, and the **half-life** ln2/θ of that spread is the number that sets your holding period — and therefore how much cost you can survive.

# A pairs trade, end to end

Time to run something through the whole pipeline. This lesson takes one strategy — the classic cointegration pairs trade — from signal to risk, and then charges it real money for trading.

The code below is deliberately **standard-library Python**: no numpy, no pandas, nothing to install. Real work would use both, but every idea here fits in sixty lines and you can run it immediately. It generates its own cointegrated pair so it is reproducible; swap the first block for real price data and the rest is unchanged.

## 1 — Signal

The spread is \`s = y − βx\`, and the tradeable statement is that \`s\` reverts. Convert to a **z-score** so the entry rule is scale-free, and trade extremes:

\`\`\`
   z > +2      spread is rich   →  SHORT the spread (sell y, buy βx)
   z < −2      spread is cheap  →  LONG  the spread (buy y, sell βx)
   |z| < 0.5   converged        →  flat
\`\`\`

One detail that quietly decides whether the whole exercise is honest: the z-score uses a **rolling** mean and standard deviation over a trailing window, not the full sample. Using full-sample statistics would let the strategy standardise today's spread using tomorrow's data — lookahead bias, and worth about a Sharpe point of pure fiction. M2.7 has more on how easily this happens.

## 2 — Sizing

Hold **1 unit of y against β units of x**, β from the cointegrating regression. That is what makes the position a bet on the spread rather than on the market: if both legs rise together, the position is flat. It is *market-neutral by construction*, which is the point of the trade — you have isolated the relationship and discarded the direction.

## 3 — Execution

Here is where M1 comes back. The estimated **half-life is 11 days**, which tells you the trade is not a latency problem — you have hours to establish a position, not microseconds, so M1.6 is irrelevant and M1.5 is everything. Pace the entry over a day, keep participation low, and impact stays small. If the half-life had been eleven *minutes*, the same statistical edge would be an entirely different and much harder business.

## 4 — Risk

The signal cannot police itself, because a structural break looks exactly like a great entry (M2.5). So the risk rules must come from outside it:

- **Stop** if |z| exceeds ~4 — that is evidence the relationship broke, not that the opportunity improved.
- **Time limit** of a few half-lives. A spread that hasn't converged in a month probably isn't going to.
- **Re-test cointegration** periodically on recent data, and retire the pair when it fails.

## The code

\`\`\`python
import math, random

# ── 1. Two cointegrated series (replace with real prices) ────────────
random.seed(42)
N, BETA, THETA, SIG_S = 1500, 1.5, 0.05, 1.0
x, spread = [100.0], [0.0]
for _ in range(N - 1):
    x.append(x[-1] + random.gauss(0, 1.0))
    spread.append(spread[-1] + THETA * (0.0 - spread[-1]) + random.gauss(0, SIG_S))
y = [BETA * xi + s + 50.0 for xi, s in zip(x, spread)]

# ── 2. Hedge ratio by OLS on levels ──────────────────────────────────
def ols(xs, ys):
    n = len(xs); mx = sum(xs)/n; my = sum(ys)/n
    sxy = sum((a-mx)*(b-my) for a, b in zip(xs, ys))
    sxx = sum((a-mx)**2 for a in xs)
    b = sxy/sxx
    return b, my - b*mx

beta_hat, alpha_hat = ols(x, y)
s = [yi - beta_hat*xi - alpha_hat for xi, yi in zip(x, y)]

# ── 3. Half-life:  Δs = a + b·s(t-1),  half-life = ln2 / -b ──────────
b_hl, _ = ols(s[:-1], [s[i+1]-s[i] for i in range(len(s)-1)])
half_life = math.log(2) / (-b_hl)

# ── 4. Rolling z-score — NOT full-sample (that would be lookahead) ───
W = 60
def zscore(i):
    win = s[i-W:i]
    m = sum(win)/W
    sd = math.sqrt(sum((v-m)**2 for v in win)/(W-1))
    return (s[i]-m)/sd if sd > 0 else 0.0

# ── 5. Backtest ──────────────────────────────────────────────────────
ENTRY, EXIT = 2.0, 0.5
def run(cost):
    pos, pnl, trades = 0, [], 0
    for i in range(W, N-1):
        z = zscore(i); new = pos
        if pos == 0:
            if z > ENTRY:    new = -1
            elif z < -ENTRY: new = +1
        elif abs(z) < EXIT:  new = 0
        step = (s[i+1]-s[i]) * pos       # P&L on yesterday's position
        turn = abs(new - pos)
        if turn: trades += 1
        pnl.append(step - turn*cost)
        pos = new
    return pnl, trades

def sharpe(p):
    n = len(p); m = sum(p)/n
    sd = math.sqrt(sum((v-m)**2 for v in p)/(n-1))
    return m/sd*math.sqrt(252)

print(f"true beta {BETA}   estimated {beta_hat:.3f}")
print(f"half-life of the spread: {half_life:.1f} days\\n")
for c in (0.0, 0.25, 0.50, 1.00):
    p, t = run(c)
    print(f"cost {c:.2f}   P&L {sum(p):7.1f}   Sharpe {sharpe(p):5.2f}   trades {t}")
\`\`\`

## What it prints

\`\`\`
   true beta 1.5   estimated 1.454
   half-life of the spread: 11.1 days

   cost/trade    total P&L    Sharpe    trades
   ──────────────────────────────────────────────
      0.00           66.8      1.39        58
      0.25           52.3      1.08        58
      0.50           37.8      0.77        58
      1.00            8.8      0.17        58
\`\`\`

## Read the table, not the first row

The signal is **identical** in every row. Same entries, same exits, same 58 trades. The only thing that changes is what you are charged to trade — and the strategy goes from a genuinely good Sharpe of 1.39 to a rounding error at 0.17.

That is the exercise the roadmap set, and it generalises well beyond pairs trading:

> **The gross backtest tells you almost nothing. The cost assumption is usually the strategy.**

Three things follow, each pointing back at earlier modules:

**Costs are not a haircut, they are the business.** A cost of 0.5 spread units per trade — half of one standard deviation of daily spread movement, entirely plausible once you add the bid-ask spread of *two* legs (M0.4) plus impact (M1.5) — removes 45% of the P&L. Anyone showing you a gross backtest is showing you the easy part.

**Half-life sets how many times you pay.** 58 trades over ~1,400 days is comfortable. Shorten the half-life to a day and you would trade perhaps 600 times for a similar gross edge, paying ten times the cost to earn the same gross — and the same table would show the strategy dead at 0.25. This is why M2.5 insisted half-life is the operationally decisive statistic.

**Capacity is a hard ceiling.** M1.5's square-root law says impact grows with the fraction of daily volume you take, so \`cost\` in that table is not a constant — it is a function of your size. Scale up and you slide down the rows of your own table until you reach the one where the strategy doesn't work. Every strategy has a size at which it stops existing.

## Two honest caveats

The estimated half-life (11.1 days) is shorter than the value built into the simulation (ln2/0.05 ≈ 13.9 days). That is not a bug — the spread being tested is an **OLS residual**, and residuals are fitted to have zero mean, which biases them toward looking more mean-reverting than the truth. Estimated half-lives on estimated spreads run optimistically short, and by exactly the mechanism that ought to make you suspicious of your own backtest.

And the data here is **synthetic, generated from a model that guarantees the spread reverts.** The strategy cannot fail for the reason real pairs trades fail — the relationship breaking. That is the deepest problem with this backtest, and it is not fixed by better code.

Which is the subject of M2.7.

> **Pub test:** Running one strategy through the whole M2.1 pipeline — signal (spread z-score), sizing (β-weighted, market-neutral), execution (paced against the half-life), risk (stop, time limit, re-test) — shows where the money actually goes. The backtest here earns **Sharpe 1.39 gross** and, on identical signals, **0.17** once a realistic round-trip cost is charged. Nothing about the signal changed; only the cost assumption did. That is the lesson the roadmap set as the exercise — the gap between *looks profitable on paper* and *is profitable after costs* is usually the entire strategy — and it is why **half-life** matters, since it decides how many times you pay.
`},

# Why backtests lie

M2.6 produced a strategy with a Sharpe of 1.39, and then charged it realistic costs and watched it die. That was the *honest* failure mode. This lesson is about the dishonest ones — the ways a backtest reports profit that was never available to anybody.

The framing that matters: **a backtest is not an experiment, it is a measurement whose bias you control.** Every degree of freedom you hold — which data, which period, which parameters, which of your many attempts to report — pushes the result one way. Nobody accidentally overfits *downwards*.

## The bugs you can actually fix

**Lookahead bias.** Using information at time t that wasn't available until later. It is almost never as obvious as reading tomorrow's price:

\`\`\`
   full-sample z-scores        standardising with a mean and σ computed
                               over the whole history — the M2.6 code
                               used a ROLLING window precisely to avoid it
   restated fundamentals       today's database has the corrected figures;
                               the market traded the originals for months
   point-in-time index members yesterday's index constituents as known
                               TODAY, not as known then
   a close-price signal        traded at the same close. You had it when?
\`\`\`

**Survivorship bias.** Backtesting today's index members over ten years tests a portfolio selected for having survived. The failures were deleted from the universe *and* from the record. This alone has been enough to manufacture entire published anomalies.

**Costs assumed away.** M2.6 showed a Sharpe going from 1.39 to 0.17 on the cost line alone. If a backtest reports gross returns, it has not reported anything.

These are all *bugs*: fixable with discipline and point-in-time data. The next one is not a bug, and it is the one that gets serious people.

## Multiple testing, quantified

M2.1 established that a Sharpe estimate is noisy — standard error ≈ √(252/n), so about **0.45** on five years of daily data. Now consider what happens when you don't test one strategy, but search.

Simulate strategies with **exactly zero edge** — pure noise, no signal whatsoever — and report the best one found:

\`\`\`
   5 years of daily data.  TRUE Sharpe of every strategy = 0.
   (standard error of a single Sharpe estimate = 0.45)

   strategies tried    best in-sample Sharpe    SE·√(2 ln N)
   ─────────────────────────────────────────────────────────
              1               −0.03                 —
             10                0.69                0.96
            100                1.13                1.36
          1,000                1.43                1.66
         10,000                1.74                1.92
\`\`\`

Read the 1,000 row. **A best-of-1,000 search over worthless strategies produces a Sharpe of 1.43** — the number M2.1 called "a good systematic strategy, genuinely hard." It is entirely an artefact of taking a maximum over many noisy estimates, and the growth is \`√(2 ln N)\`, so it is slow but relentless: you cannot outrun it by being clever, only by testing less.

And note how easy it is to reach 1,000 without feeling like you searched:

\`\`\`
   2 entry thresholds × 3 exit rules × 4 lookback windows
     × 5 universes × 3 holding periods × 3 date ranges  =  1,080
\`\`\`

Nobody experiences that as running a thousand experiments. It feels like *tuning*. But the statistics only count how many results you looked at before choosing one, not how virtuous you felt while looking.

This is why **out-of-sample testing is not optional and is also easily faked** — testing on your holdout, adjusting, and testing again converts the holdout into training data. A holdout survives exactly one look.

The formal repair is to **deflate the Sharpe** by how many trials produced it — Bailey and López de Prado's deflated Sharpe ratio does precisely this, and it requires an input almost nobody records: the true number of variants tried. The practical repair is to *write that number down as you go*.

## Capacity, and the profit that isn't there

Even a real edge may not be harvestable at your size. M1.5's square-root law says cost per share grows with participation, so total cost scales like **Q^1.5** while gross profit scales like Q. They cross:

\`\`\`
   gross alpha  ∝  Q            ────╮
   cost         ∝  Q^1.5        ────┴──▶  net profit peaks, then falls

   beyond the peak, trading MORE makes LESS
\`\`\`

A backtest run on notional you will never deploy is measuring a strategy that doesn't exist at your size. This is also why genuinely good strategies get quietly closed to new money rather than scaled — a fact that looks like modesty and is arithmetic.

## Regime, and the deepest problem

M2.6's final caveat was that its data came from a model *guaranteeing* the spread reverts, so the strategy could not fail the way real pairs trades fail. Real backtests have a subtler version of the same defect: the past is one sample path from a world whose rules were themselves changing.

Decimalisation, Reg NMS, the rise of HFT, quantitative easing, the 2020 retail wave — each altered the microstructure the strategy trades in. A backtest spanning them assumes a stationarity that observably did not hold. No statistical technique repairs this; only awareness and shorter memory do.

## What honest practice looks like

None of the defences are clever. They are all structural, which is why they are so widely skipped.

\`\`\`
   ✓  Hold out the last 20–30% of history and DO NOT LOOK until the end.
      One look. If you adjust after looking, it is training data now.

   ✓  Count every variant tried, including the ones you abandoned.
      Report it. Deflate by it.

   ✓  Subtract costs before you are allowed to be pleased. Use M1.5's
      square-root law at your intended size, not a flat basis-point fee.

   ✓  Prefer few parameters and economic reasoning. A strategy you can
      explain in one sentence has fewer ways to be an artefact.

   ✓  Paper trade, then trade small. Live results are the only sample
      you did not fit to.

   ✓  Expect roughly HALF the backtested Sharpe in live trading, and be
      unsurprised when it is worse.
\`\`\`

That last line is the industry's rule of thumb, and everything in this lesson explains why it is not pessimism. Between multiple testing, cost optimism, capacity, and regime drift, a 50% haircut is a reasonable prior, not a cynical one.

## Where M2 leaves you

You can now take a claim of edge apart: what is the signal, is it alpha or repackaged beta, how noisy is the estimate, how many variants were tried, what does it cost to trade, and how much size does it hold? That is the whole of M2.1 through M2.7, and it is a more useful skill than any individual strategy.

One assumption has been quietly load-bearing throughout, and it is wrong. Everything here — the Sharpe ratio, the standard errors, Black–Scholes, the risk calculations — assumes returns are approximately **normally distributed**. They are not, and the ways they fail are not small corrections. **M3 is where that assumption gets taken apart.**

> **Pub test:** A backtest is a **measurement with a bias you control**, so it flatters by default. **Lookahead** and **survivorship** are bugs you can fix; **multiple testing** is the one that gets everybody — with five years of daily data and *no real edge at all*, searching 1,000 strategies yields a best in-sample Sharpe of about **1.4**, purely by chance, because the standard error of a Sharpe estimate is ~0.45 and you kept the maximum of many draws. Costs and **capacity** finish the job. The defences are structural rather than statistical — hold out data you never look at, **count and report every variant tried**, subtract costs before believing anything, and size the first live trade as an experiment.
